<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Planet</title>
<meta name="description" content="The Planet (10⁷ m): Earth · 12,742 km across · a thin skin of rock and air around a ball of hot stone and metal. Explained simply by an AI narrator, with captions. One of nine scales, from the nucleus to the universe.">
<meta name="theme-color" content="#03050b">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>

html,body{margin:0;height:100%;background:#03050b;overflow:hidden;color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;text-align:center;padding:max(14px,env(safe-area-inset-top)) 16px 30px;background:linear-gradient(rgba(3,5,11,.72),rgba(3,5,11,.3) 65%,transparent)}

.k b{color:var(--acc);font-weight:600}
.name{font-weight:700;font-size:clamp(30px,6.2vw,76px);line-height:1.02;letter-spacing:.06em;text-transform:uppercase;margin:.18em 0 .12em;color:#fff;text-shadow:0 0 28px rgba(110,165,255,.7),0 0 6px rgba(160,200,255,.55),0 2px 14px rgba(0,0,0,.9);animation:rise 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;letter-spacing:.3em;filter:blur(6px)}to{opacity:1;letter-spacing:.06em;filter:blur(0)}}
.sub{font:400 clamp(11px,1.3vw,14px)/1.5 "JetBrains Mono",ui-monospace,monospace;color:var(--dim);letter-spacing:.05em;max-width:920px;margin:0 auto}
#cc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom)) + 74px);width:max-content;max-width:min(92vw,820px);text-align:center;pointer-events:none}

@keyframes pulse{50%{box-shadow:0 0 54px rgba(143,194,255,.95)}}
#ruler{position:fixed;left:max(52px,env(safe-area-inset-left));right:max(52px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));height:56px}
#ruler:before{content:"";position:absolute;left:0;right:0;top:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(143,194,255,.55) 6%,rgba(143,194,255,.55) 94%,transparent)}

#ruler a:before{content:"";position:absolute;left:50%;top:15px;width:9px;height:9px;margin-left:-5px;border-radius:50%;background:#0b1326;box-shadow:0 0 0 1.5px rgba(143,194,255,.75);transition:transform .2s,background .2s}

#ruler a.up{padding-top:0;top:-14px}

#ruler a.me:before{background:#fff;box-shadow:0 0 0 2px var(--acc),0 0 18px 4px rgba(143,194,255,.9);transform:scale(1.35)}

#ruler .cap.l{left:-30px}#ruler .cap.r{right:-30px}

.nav:hover i,.nav:focus-visible i{transform:scale(1.12);background:rgba(143,194,255,.25);box-shadow:0 0 0 2px #8fc2ff,0 0 24px rgba(143,194,255,.75)}

.nav.r{right:max(6px,env(safe-area-inset-right))}
.nav b{display:block;color:#8fc2ff;font-weight:600}

@media (prefers-reduced-motion:reduce){.name,#snd{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

</div>

<audio id="au" src="./narration.mp3" preload="auto" loop muted autoplay playsinline></audio>

,14.89,"The ground you stand on is just the thin skin."],[14.89,17.7,"Under it is hot, slow, gooey rock."],[17.7,22.21,"And in the very middle is a ball of metal, as hot as the surface of the Sun."],[22.21,23.96,"Why is the Earth round?"],[23.96,26.59,"Because gravity pulls everything toward the middle,"],[26.59,30.74,"the same from every side, like hands squeezing a snowball."],[30.74,33.22,"The air you breathe is thinner than you think."],[33.22,34.82,"If the Earth were an apple,"],[34.82,37.69,"all the air would be thinner than the apple's skin."],[37.69,38.92,"And the Moon?"],[38.92,40.12,"It is far."],[40.12,45.199999999999996,"You could fit every other planet in the solar system in the gap between here and there."]],"dur":45.2};

var sprites = {};

}

    for (i = 0; i < 4200; i++) { var y2 = r() * 2 - 1, r2 = Math.sqrt(1 - y2 * y2), t2 = r() * 6.2832, x2 = Math.cos(t2) * r2, z2 = Math.sin(t2) * r2; if (fbm(x2 * 2.6 + 9, y2 * 4 + 2, z2 * 2.6 + 4) > 0.55) C.push([x2, y2, z2]); }

      T('crust: the peach skin, 5 to 70 km', 0, '#8a5a36'); T('mantle: hot, slow rock', 1, '#c8552b'); T('outer core: liquid iron', 2, '#f0a23a'); T('inner core: solid, 5,400 °C', 3, '#fff0b8'); }

// ---------------------------------------------------------------- page
var cv = document.getElementById('c'), cx = cv.getContext('2d'), W = 0, Hh = 0, dpr = 1;
function fit() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; Hh = innerHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0); if (SCENE.resize) SCENE.resize(W, Hh); }
addEventListener('resize', fit);
var me = D.scales[D.i];
document.getElementById('k').innerHTML = 'Scale ' + (D.i + 1) + ' of ' + D.scales.length + ' · <b>' + me.size + '</b>';
document.getElementById('name').textContent = me.name;
document.getElementById('sub').textContent = me.sub;
var ruler = document.getElementById('ruler'), lo = D.scales[0].exp, hi = D.scales[D.scales.length - 1].exp;
ruler.innerHTML = '<span class="cap l">← smaller</span><span class="cap r">bigger →</span>' + D.scales.map(function (s, i) {
  return '<a href="https://' + s.domain + '/" class="' + (i === D.i ? 'me ' : '') + (i % 2 ? 'up' : '') + '" style="left:' + ((s.exp - lo) / (hi - lo) * 100).toFixed(2) + '%"' + (i === D.i ? ' aria-current="page"' : '') + ' title="' + s.name + ' · ' + s.size + ' · ' + s.domain + '"><b>' + s.size + '</b><span>' + s.short + '</span></a>';
}).join('');

// the arrows at the sides: one scale smaller, one scale bigger (they wrap round at the ends); the arrow keys do the same
(function () { var n = D.scales.length, pv = D.scales[(D.i - 1 + n) % n], nx = D.scales[(D.i + 1) % n];
  function nav(cls, s, arrow, word) { var a = document.createElement('a'); a.className = 'nav ' + cls; a.href = 'https://' + s.domain + '/'; a.title = word + ': ' + s.name + ' (' + s.size + ')'; a.setAttribute('aria-label', word + ': ' + s.name); a.innerHTML = '<i>' + arrow + '</i><span>' + word + '<b>' + s.short + '</b></span>'; document.body.appendChild(a); return a; }
  var L = nav('l', pv, '‹', D.i === 0 ? 'biggest' : 'smaller'), R = nav('r', nx, '›', D.i === n - 1 ? 'smallest' : 'bigger');
  addEventListener('keydown', function (e) { if (e.altKey || e.ctrlKey || e.metaKey) return; if (e.key === 'ArrowLeft') location.href = L.href; else if (e.key === 'ArrowRight') location.href = R.href; });
})();

// the voice: muted until the first tap (browsers require it); the captions and the picture follow its clock either way
var au = document.getElementById('au'), snd = document.getElementById('snd'), cap = document.getElementById('cap'), started = false, t0 = performance.now(), shown = -2;
function nt() { return (!au.paused && au.readyState > 1 && isFinite(au.currentTime)) ? au.currentTime : ((performance.now() - t0) / 1000) % (D.dur + 2); }
function setSnd() { snd.classList.add('on'); snd.innerHTML = au.muted ? '&#128263; Sound off' : '&#128266; Sound on'; snd.setAttribute('aria-label', au.muted ? 'Turn the sound on' : 'Turn the sound off'); }
function begin() { if (started) return; started = true; au.muted = false; au.currentTime = 0; t0 = performance.now(); var p = au.play(); if (p && p.catch) p.catch(function () {}); setSnd(); }
addEventListener('pointerdown', function (e) { if (!started) { begin(); return; } if (e.target === snd) { au.muted = !au.muted; setSnd(); } }, { passive: true });
addEventListener('keydown', function (e) { if (!started) begin(); else if (e.target === snd && (e.key === 'Enter' || e.key === ' ')) { au.muted = !au.muted; setSnd(); } });
var pp = au.play(); if (pp && pp.catch) pp.catch(function () {});

var last = performance.now(), T = +(new URLSearchParams(location.search).get("t") || 0); // ?t=seconds jumps the picture ahead
fit(); SCENE.init(W, Hh);
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  var n = nt();
  cx.globalCompositeOperation = 'source-over'; cx.globalAlpha = 1;
  SCENE.draw(cx, W, Hh, T, dt, n);
  var q = -1; for (var j = 0; j < D.cues.length; j++) { if (n >= D.cues[j][0] && n < D.cues[j][1]) { q = j; break; } }
  if (q !== shown) { shown = q; cap.textContent = q < 0 ? '' : D.cues[q][2]; }
}
requestAnimationFrame(frame);
})();
</script>
