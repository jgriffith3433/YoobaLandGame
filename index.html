  function hushSay() { if (au) { au.pause(); au = null; } if (window.speechSynthesis) speechSynthesis.cancel(); }
  function show(on) { box.classList.toggle('open', on); paint(); if (on) { try { inp.focus({ preventScroll: true }); } catch (e) {} } else { hushSay(); if (rec) rec.abort(); } }
  function say(text, side) {
    hushSay(); if (!voice || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    var u = new SpeechSynthesisUtterance(text), en = /^en/i.test(navigator.language || 'en');
    if (en) { var vs = speechSynthesis.getVoices().filter(function (v) { return /^en/i.test(v.lang); }); if (vs.length) u.voice = vs[side ? Math.min(1, vs.length - 1) : 0]; }

  }

    text = String(text || '').trim().slice(0, 400); if (!text || busy) return;
    busy = true; $('asks').disabled = true; inp.value = ''; CH.hush(); hushSay();
    var side = CH.side(), q = { role: 'user', content: text, side: side }; add('me', text); var b = add('ai wait', '');
    fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: D.key, side: side, messages: hist.slice(-12).concat([q]) }) })
      .then(function (r) {
        if (!r.ok) throw r.status; var rd = r.body.getReader(), dec = new TextDecoder(), all = '';
        return (function pump() { return rd.read().then(function (x) { if (x.done) return all; all += dec.decode(x.value, { stream: true }); b.textContent = all.split('\u001e')[0]; logE.scrollTop = 1e6; return pump(); }); })();
      })
      .then(function (all) { var p = all.split('\u001e'), t = p[0].trim(); if (!t) throw 0; b.textContent = t; hist.push(q, { role: 'assistant', content: t, side: side }); say(t, side); })
      .catch(function (e) { b.classList.add('err'); b.textContent = e === 429 ? 'I need a short rest: a lot of people are asking me things. Could you try again in a minute?' : 'Hmm, I lost my train of thought. Could you ask me that again?'; })
      .then(function () { busy = false; $('asks').disabled = false; b.classList.remove('wait'); logE.scrollTop = 1e6; });
  }
  btn.onclick = function () { show(!isOpen()); };
  $('askx').onclick = function () { show(false); };
  vB.onclick = function () { voice = !voice; if (!voice) hushSay(); setVoice(); };
  $('askf').onsubmit = function (e) { e.preventDefault(); send(inp.value); };
  box.addEventListener('keydown', function (e) { if (e.key === 'Escape') { show(false); btn.focus(); } });
  if (SR) micB.onclick = function () {
    if (rec) { rec.stop(); return; }
    CH.hush(); hushSay(); var r = rec = new SR(), heard = '';
    r.lang = navigator.language || 'en-US'; r.interimResults = true;
    r.onresult = function (e) { heard = ''; for (var i = 0; i < e.results.length; i++) heard += e.results[i][0].transcript; inp.value = heard; };
    r.onerror = function (e) { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') add('ai err', 'I could not use the microphone. You can type to me instead.'); };
    r.onend = function () { if (rec === r) rec = null; micB.classList.remove('on'); if (heard.trim()) send(heard); };
    try { r.start(); micB.classList.add('on'); } catch (e) { rec = null; }
  };
  CH.onSide(function () { hushSay(); paint(); });
  setVoice(); paint();
}

  if (s) Tb += dt; else T += dt;
