<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Up</title>
<style>
@import url(https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;700&display=swap);
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0008;overflow:hidden;width:100vw;height:100vh;font-family:'IBM Plex Mono',monospace;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}

#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#0a0008 0%,#1a0515 50%,#2a0a10 100%);z-index:20;transition:opacity .8s;padding:20px}
#overlay.gone{opacity:0;pointer-events:none}
.ov-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(80px,16vw,180px);letter-spacing:12px;background:linear-gradient(180deg,#ff88aa,#ffcc44);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:.9;text-align:center}
.ov-sub{margin-top:14px;font-size:clamp(13px,2.3vw,16px);letter-spacing:5px;color:rgba(255,200,220,.75);text-align:center;line-height:2.4;text-transform:uppercase}
.ov-controls{margin-top:28px;font-size:clamp(15px,2.6vw,17px);letter-spacing:2px;color:rgba(255,220,230,.7);text-align:center;line-height:2.8}
.ov-controls b{color:#ffaacc;font-size:clamp(16px,2.8vw,18px)}
#start-btn{margin-top:40px;padding:18px 56px;min-height:52px;max-width:280px;width:90%;background:linear-gradient(135deg,#cc3366,#ff6699);color:#fff;border:none;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:6px;cursor:pointer;transition:all .15s;border-radius:30px;box-shadow:0 0 30px rgba(255,100,150,.3)}
#start-btn:hover{transform:scale(1.06);box-shadow:0 0 50px rgba(255,100,150,.5)}
#prog-wrap{margin-top:24px;width:180px;height:2px;background:rgba(255,255,255,.08);display:none;border-radius:1px}
#prog-fill{height:100%;background:linear-gradient(90deg,#ff6699,#ffcc44);width:0%;transition:width 60ms;border-radius:1px}
#load-txt{margin-top:10px;font-size:9px;letter-spacing:3px;color:rgba(255,200,220,.5);display:none}

#hud{position:fixed;top:0;left:0;right:0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:10;opacity:0;transition:opacity .8s}
#hud.on{opacity:1}
#hud-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:5px;color:rgba(255,255,255,.2)}
#progress-bar-wrap{flex:1;margin:0 16px;height:2px;background:rgba(255,255,255,.06);position:relative;border-radius:1px}
#progress-bar-fill{height:100%;width:0%;transition:width .1s;border-radius:1px}
#progress-label{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.2);position:absolute;top:6px;left:0}
#rewind-btn{padding:9px 18px;background:rgba(255,180,220,.08);border:1px solid rgba(255,180,220,.3);color:rgba(255,180,220,.7);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:3px;cursor:pointer;pointer-events:all;transition:all .15s;text-transform:uppercase;border-radius:14px;user-select:none}
#rewind-btn.active{background:rgba(255,180,220,.25);border-color:rgba(255,180,220,.8);color:#fff;box-shadow:0 0 12px rgba(255,150,200,.4)}

#crash-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:15;opacity:0;pointer-events:none;transition:opacity .3s}
#crash-screen.show{opacity:1;pointer-events:all}
#crash-msg{font-family:'Bebas Neue',sans-serif;font-size:clamp(50px,10vw,110px);letter-spacing:5px;color:#ff6699;text-shadow:0 0 40px rgba(255,100,150,.6);text-align:center}
#crash-sub{font-size:10px;letter-spacing:4px;color:rgba(255,200,220,.35);margin-top:8px;text-align:center}
#crash-rewind-btn{margin-top:24px;padding:14px 48px;background:rgba(255,180,220,.12);border:1px solid rgba(255,180,220,.4);color:rgba(255,180,220,.9);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:4px;cursor:pointer;transition:all .15s;text-transform:uppercase;border-radius:20px;user-select:none;touch-action:none}
#crash-rewind-btn.active,#crash-rewind-btn:hover{background:rgba(255,180,220,.25);color:#fff;box-shadow:0 0 20px rgba(255,150,200,.4)}
#crash-continue{margin-top:10px;padding:8px 28px;background:0 0;border:none;color:rgba(255,255,255,.25);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:3px;cursor:pointer;text-transform:uppercase;text-decoration:underline}
#crash-continue:hover{color:rgba(255,255,255,.5)}

#end-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,20,.7);z-index:18;opacity:0;pointer-events:none;transition:opacity 1s}
#end-screen.show{opacity:1;pointer-events:all}
#end-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(50px,10vw,110px);letter-spacing:10px;background:linear-gradient(180deg,#ffcc44,#ff88aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
#end-sub{font-size:11px;letter-spacing:5px;color:rgba(255,220,200,.5);margin-top:14px;text-align:center;line-height:2.2}
#end-hearts{font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,6vw,60px);color:#ff6699;margin-top:10px;text-shadow:0 0 30px rgba(255,100,150,.5)}
#end-replay{margin-top:28px;padding:12px 40px;background:linear-gradient(135deg,#cc3366,#ff6699);border:none;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:4px;cursor:pointer;border-radius:20px;text-transform:uppercase}

#move-hint{position:fixed;bottom:34px;left:22px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:2px;color:rgba(255,200,220,.18);z-index:12;pointer-events:none;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="move-hint">↕ drag to steer</div>

<div id="hud">
  <div id="hud-title">UP</div>
  <div id="progress-bar-wrap">
    <div id="progress-bar-fill"></div>
    <div id="progress-label">inferno</div>
  </div>
  <button id="rewind-btn">⟲ rewind</button>
</div>

<div id="crash-screen">
  <div id="crash-msg">oh no...</div>
  <div id="crash-sub">you didn't make it</div>
  <button id="crash-rewind-btn">⟲ hold to rewind</button>
  <button id="crash-continue">continue without hearts</button>
</div>

<div id="end-screen">
  <div id="end-title">YOU MADE IT</div>
  <div id="end-sub">you rose above it all</div>
  <div id="end-hearts">♥ 0</div>
  <button id="end-replay">fly again</button>
</div>

<div id="overlay">
  <div class="ov-title">UP</div>
  <div class="ov-sub">rise up<br>collect every heart<br>never look down</div>
  <div class="ov-controls">
    <b>↑ ↓ / W A S D</b>&nbsp; steer up &amp; down<br>
    <b>drag up/down</b>&nbsp; on mobile to fly<br>
    <b>hold rewind</b>&nbsp; to undo mistakes
  </div>
  <button id="start-btn">take flight</button>
  <div id="prog-wrap"><div id="prog-fill"></div></div>
  <div id="load-txt"></div>
</div>

<script>
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
let cachedSkyGrad=null,cachedSkyKey='';
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;cachedSkyKey=''}
resize();
addEventListener('resize',resize);

// ═══ AUDIO ENGINE ═══
let audioCtx,analyser,freqData,freqLen,decodedBuffer=null,scrubNode=null;
let scrubTargetSample=0,scrubCurrentSample=0,scrubRate=0,prevTargetSample=0;
let songDuration=0,songCurrent=0,songProgress=0;
let energy=0,bassE=0,midE=0,highE=0,beat=0,prevBass=0,smoothBins=[];
const MOVE_SPD=5.2;

function initScrubAudio(){
  const nc=decodedBuffer.numberOfChannels,sr=decodedBuffer.sampleRate,total=decodedBuffer.length,channels=[];
  for(let ch=0;ch<nc;ch++)channels.push(decodedBuffer.getChannelData(ch));
  scrubNode=audioCtx.createScriptProcessor(2048,0,nc);
  scrubCurrentSample=0;scrubTargetSample=0;scrubRate=0;prevTargetSample=0;
  let aRate=0,aVol=0;const sm=1-Math.exp(-1/(sr*0.03));
  const posArr=new Float64Array(2048),volArr=new Float32Array(2048);
  scrubNode.onaudioprocess=function(e){
    const out=e.outputBuffer,len=out.getChannelData(0).length,tgtRate=scrubRate;
    const drift=(scrubTargetSample-scrubCurrentSample)*0.000015;
    let p=scrubCurrentSample,r=aRate,v=aVol;
    for(let i=0;i<len;i++){r+=(tgtRate-r)*sm;const tv=clamp(Math.abs(r)*2.5,0,1);v+=(tv-v)*sm;p+=r+drift;posArr[i]=p;volArr[i]=v}
    aRate=r;aVol=v;scrubCurrentSample=p;
    for(let ch=0;ch<nc;ch++){const outCh=out.getChannelData(ch),srcCh=channels[ch];
      for(let i=0;i<len;i++){const pos=posArr[i],idx=Math.floor(pos),frac=pos-idx;
        if(idx>=0&&idx<total-1)outCh[i]=(srcCh[idx]*(1-frac)+srcCh[idx+1]*frac)*volArr[i];else outCh[i]=0}}
  };
  scrubNode.connect(analyser);analyser.connect(audioCtx.destination);
}

function audioTick(){
  if(!analyser)return;analyser.getByteFrequencyData(freqData);
  let tot=0,bas=0,mid=0,hgh=0;
  for(let i=0;i<freqLen;i++){const v=freqData[i]/255;tot+=v;if(i<6)bas+=v;else if(i<45)mid+=v;else hgh+=v}
  bas/=6;mid/=39;hgh/=Math.max(1,freqLen-45);tot/=freqLen;
  const bd=bas-prevBass;if(bd>0.10)beat=1;prevBass=bas;beat=Math.max(0,beat-0.055);
  energy=lerp(energy,tot,0.12);bassE=lerp(bassE,bas,0.22);midE=lerp(midE,mid,0.14);highE=lerp(highE,hgh,0.11);
}

function updateSongFromScroll(){
  songProgress=clamp(scrollX/WORLD_WIDTH,0,1);songCurrent=songProgress*songDuration;
  if(decodedBuffer){
    scrubTargetSample=Math.floor(songCurrent*decodedBuffer.sampleRate);
    if(rewinding){
      const delta=scrubTargetSample-prevTargetSample,spf=decodedBuffer.sampleRate/60;
      scrubRate=lerp(scrubRate,delta/spf,0.12);
    }else{
      // Normal forward play: fixed rate, let drift keep sync
      scrubRate=1;
    }
    prevTargetSample=scrubTargetSample;
  }
}

// ═══ ZONES ═══
const TUNNEL_END=0.14;
const ESCAPE_BLOOM_END=0.20;

let WORLD_WIDTH=0;
function zoneAt(p){if(p<TUNNEL_END)return 0;if(p<0.30)return 1;if(p<0.55)return 2;if(p<0.78)return 3;return 4}

// Pre-computed zone color arrays [skyT_r,skyT_g,skyT_b, skyB_r,skyB_g,skyB_b, gnd_r,gnd_g,gnd_b, acc_r,acc_g,acc_b]
const ZC=[
  [4,0,2, 15,3,2, 12,2,0, 255,60,10],
  [50,30,20, 150,90,50, 80,60,30, 220,160,60],
  [70,120,180, 160,210,245, 80,150,55, 120,210,100],
  [35,80,190, 130,190,250, 140,145,155, 180,220,255],
  [15,20,60, 255,200,120, 255,250,245, 255,220,150]
];
const zoneBounds=[0,TUNNEL_END,0.30,0.55,0.78,1.0];

// Interpolated zone colors — written into reusable array to avoid allocation
const zc=new Int32Array(12);
function getZC(prog){
  const z=zoneAt(prog);
  if(z===4){for(let i=0;i<12;i++)zc[i]=ZC[4][i];return}
  const nx=Math.min(z+1,4);
  const t=clamp((prog-zoneBounds[z])/(zoneBounds[z+1]-zoneBounds[z]),0,1);
  const a=ZC[z],b=ZC[nx];
  for(let i=0;i<12;i++)zc[i]=(a[i]+(b[i]-a[i])*t)|0;
}

function groundY(p){
  if(p<TUNNEL_END)return lerp(H*0.62,H*0.70,p/TUNNEL_END);
  return lerp(H*0.70,H*0.92,clamp((p-TUNNEL_END)/0.4,0,1));
}
function ceilingY(p){
  if(p<TUNNEL_END)return lerp(H*0.08,H*0.15,p/TUNNEL_END);
  const lift=clamp((p-TUNNEL_END)/0.08,0,1);
  return lerp(H*0.15,-H*0.3,lift);
}

// ═══ INPUT ═══
const keys={};
const touchState={up:false,down:false};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
function inp(c){
  if(c==='up')return keys.ArrowUp||keys.KeyW||keys.KeyA||touchState.up;
  if(c==='down')return keys.ArrowDown||keys.KeyS||keys.KeyD||touchState.down;
  return false;
}

// ═══ PLANE & STATE ═══
const pl={x:0,y:0,vx:0,vy:0,w:36,h:16,tilt:0,hearts:0,maxHearts:0,
  crashed:false,crashTimer:0,invince:0,multiplier:1,multiTimer:0};
let scrollX=0,camX=0,frame=0;

function resetPlane(){
  pl.x=80;pl.y=H*0.35;pl.vx=0;pl.vy=0;pl.tilt=0;
  pl.hearts=0;pl.maxHearts=0;pl.crashed=false;pl.crashTimer=0;pl.invince=300;
  pl.multiplier=1;pl.multiTimer=0;
}

// ═══ WORLD GENERATION ═══
class SeededRNG{constructor(s=42){this.s=s}next(){this.s=(this.s*16807)%2147483647;return(this.s-1)/2147483646}range(a,b){return a+this.next()*(b-a)}}
let rng;

let hoops=[],hearts=[],clouds=[],obstacles=[],crashParticles=[],sparkles=[],floatingTexts=[];

function generateWorld(){
  rng=new SeededRNG(7777);
  hoops=[];hearts=[];clouds=[];obstacles=[];floatingTexts=[];

  let hx=600;
  while(hx<WORLD_WIDTH){
    const prog=clamp(hx/WORLD_WIDTH,0,1);
    const gy=groundY(prog);
    const cy=ceilingY(prog);
    const safeTop=prog<TUNNEL_END?cy+30:40;
    const safeBot=gy-50;

    const hy=rng.range(safeTop+40,safeBot-30);
    const hr=rng.range(40,65);
    hoops.push({x:hx,y:hy,r:hr,passed:false,flash:0,reward:Math.floor(rng.range(3,7)),precision:0,precisionTimer:0});

    if(prog>=TUNNEL_END){
      const numH=Math.floor(rng.range(3,8));
      for(let i=0;i<numH;i++){
        const hxx=hx-rng.range(100,500);
        const hProg=clamp(hxx/WORLD_WIDTH,0,1);
        if(hProg>=TUNNEL_END&&hxx>200){
          const hyy=rng.range(safeTop+20,safeBot-20);
          hearts.push({x:hxx,y:hyy,collected:false,phase:rng.next()*Math.PI*2,magnet:0});
        }
      }
    }

    if(prog>0.03&&prog<TUNNEL_END){
      if(rng.next()>0.4){
        const ox=hx-rng.range(80,300);
        if(ox>400){
          const fromCeiling=rng.next()>0.5;
          const obH=25+rng.next()*40;
          obstacles.push({x:ox,y:fromCeiling?ceilingY(clamp(ox/WORLD_WIDTH,0,1)):groundY(clamp(ox/WORLD_WIDTH,0,1)),
            w:12+rng.next()*10,h:obH,prog:clamp(ox/WORLD_WIDTH,0,1),tunnel:true,fromCeiling});
        }
      }
    }

    if(prog>0.55&&prog<0.82){
      if(rng.next()>0.5){
        const ox=hx-rng.range(80,350);
        obstacles.push({x:ox,y:groundY(clamp(ox/WORLD_WIDTH,0,1)),w:60+rng.next()*80,h:40+rng.next()*60,prog:clamp(ox/WORLD_WIDTH,0,1),mountain:true});
      }
    }

    hx+=rng.range(550,900);
  }

  for(let cx=WORLD_WIDTH*TUNNEL_END;cx<WORLD_WIDTH+W;cx+=rng.range(400,900)){
    const prog=clamp(cx/WORLD_WIDTH,0,1);
    const cyy=rng.range(50,H*0.7);
    const cs=rng.range(0.5,1.1);
    const layer=rng.next()>0.6?'far':'near';
    const op=prog>0.75?0.55+rng.next()*0.2:0.12+rng.next()*0.12;
    clouds.push({x:cx,y:cyy,scale:cs,layer,opacity:op,seed:rng.next()*999});
  }
}

// ═══ REWIND ═══
const REWIND_MAX=420,REWIND_RATE=2;
let history=[],rewinding=false,rewindHeld=false,rewindFrameCount=0;

function snapState(){
  return{px:pl.x,py:pl.y,pvx:pl.vx,pvy:pl.vy,ptilt:pl.tilt,
    phearts:pl.hearts,pmaxH:pl.maxHearts,pcrash:pl.crashed,pinv:pl.invince,
    pmulti:pl.multiplier,pmultiT:pl.multiTimer,scrollX,camX,frame};
}
function pushHistory(){history.push(snapState());if(history.length>REWIND_MAX)history.shift()}
function popHistory(){
  if(!history.length)return false;
  const s=history.pop();
  pl.x=s.px;pl.y=s.py;pl.vx=s.pvx;pl.vy=s.pvy;pl.tilt=s.ptilt;
  pl.hearts=s.phearts;pl.maxHearts=s.pmaxH;pl.crashed=s.pcrash;pl.invince=s.pinv;
  pl.multiplier=s.pmulti;pl.multiTimer=s.pmultiT;
  scrollX=s.scrollX;camX=s.camX;frame=s.frame;
  return true;
}

// ═══ PARTICLES ═══
function spawnCrashHearts(x,y,count){
  const n=Math.min(count,60);
  for(let i=0;i<n;i++){
    const ang=(i/n)*Math.PI*2+(Math.random()-0.5)*0.5;
    const spd=3+Math.random()*8;
    crashParticles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-3-Math.random()*4,
      life:1,rot:Math.random()*Math.PI*2,rotSpd:(Math.random()-0.5)*0.15,sz:8+Math.random()*10});
  }
}
function spawnSparkle(x,y,col){
  if(sparkles.length>120)return;
  sparkles.push({x,y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:1,col,sz:2+Math.random()*4});
}
function spawnFloatingText(x,y,text,col,sz){
  floatingTexts.push({x,y,text,col,sz:sz||24,life:1,vy:-1.5});
}

// ═══ PHYSICS ═══
function physicsUpdate(){
  if(pl.crashed){pl.crashTimer++;return}

  pl.vx=lerp(pl.vx,MOVE_SPD,0.06);
  const targetVY=inp('up')?-4.5:inp('down')?4.5:-0.4;
  pl.vy=lerp(pl.vy,targetVY,0.1);

  pl.x+=pl.vx;
  pl.y+=pl.vy;
  pl.tilt=lerp(pl.tilt,clamp(pl.vy*-0.06,-0.4,0.4),0.12);

  if(pl.multiTimer>0){pl.multiTimer--;if(pl.multiTimer<=0)pl.multiplier=1}

  const cy=ceilingY(songProgress);
  if(pl.y<cy+15){
    if(pl.invince>0){pl.y=cy+15;pl.vy=Math.max(0,pl.vy)}
    else{triggerCrash();return}
  }

  if(pl.invince>0)pl.invince--;

  const gy=groundY(songProgress);
  if(pl.y+pl.h>gy-15){
    if(pl.invince>0){pl.y=gy-15-pl.h;pl.vy=Math.min(pl.vy,-2)}
    else{triggerCrash();return}
  }

  if(pl.invince<=0){
    for(let oi=0;oi<obstacles.length;oi++){
      const ob=obstacles[oi];
      const sx=ob.x-scrollX;
      if(sx<-100||sx>W+100)continue;
      let obTop,obBot;
      if(ob.tunnel){
        if(ob.fromCeiling){obTop=ob.y;obBot=ob.y+ob.h}
        else{obTop=ob.y-ob.h;obBot=ob.y}
      }else{obTop=ob.y-ob.h;obBot=ob.y}
      if(pl.x+pl.w>ob.x&&pl.x<ob.x+ob.w&&pl.y+pl.h>obTop&&pl.y<obBot){
        triggerCrash();return;
      }
    }
  }

  if(songProgress>=TUNNEL_END){
    const magnetRange=60+pl.hearts*0.3;
    for(let hi=0;hi<hearts.length;hi++){
      const h=hearts[hi];
      if(h.collected)continue;
      const dx=(pl.x+pl.w/2)-h.x,dy=(pl.y+pl.h/2)-h.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<magnetRange){h.magnet=lerp(h.magnet,1,0.08);h.x+=dx*0.08*h.magnet;h.y+=dy*0.08*h.magnet}
      if(dist<22){
        h.collected=true;
        const gain=pl.multiplier;
        pl.hearts+=gain;
        pl.maxHearts=Math.max(pl.maxHearts,pl.hearts);
        for(let i=0;i<4;i++)spawnSparkle(h.x,h.y,'#ff88bb');
        if(gain>1)spawnFloatingText(h.x-scrollX,h.y,'+'+gain,'rgba(255,150,200,0.9)',18);
      }
    }
  }

  for(let hi=0;hi<hoops.length;hi++){
    const hp=hoops[hi];
    if(hp.passed)continue;
    if(pl.x+pl.w>hp.x-5&&pl.x<hp.x+5){
      const dy=Math.abs((pl.y+pl.h/2)-hp.y);
      if(dy<hp.r-8){
        hp.passed=true;hp.flash=1;
        const precision=1-dy/(hp.r-8);
        hp.precision=precision;hp.precisionTimer=1;

        let multiGain,label,labelCol;
        if(precision>0.85){multiGain=4;label='PERFECT!';labelCol='rgba(255,220,80,1)'}
        else if(precision>0.5){multiGain=2;label='GREAT!';labelCol='rgba(255,180,120,0.9)'}
        else{multiGain=1;label='OK';labelCol='rgba(200,200,200,0.7)'}

        pl.multiplier=Math.max(pl.multiplier,multiGain);
        pl.multiTimer=180;

        const heartGain=hp.reward*multiGain;
        if(songProgress>=TUNNEL_END){
          pl.hearts+=heartGain;pl.maxHearts=Math.max(pl.maxHearts,pl.hearts);
        }

        const sx=hp.x-scrollX;
        spawnFloatingText(sx,hp.y-hp.r-10,label,labelCol,precision>0.85?32:24);
        if(songProgress>=TUNNEL_END&&heartGain>0)spawnFloatingText(sx,hp.y-hp.r-36,'+'+heartGain+' ♥','rgba(255,100,170,0.9)',20);
        if(multiGain>1)spawnFloatingText(sx,hp.y+hp.r+20,'x'+multiGain,'rgba(255,200,80,0.9)',28);

        const sparkCount=precision>0.85?15:precision>0.5?8:4;
        const sparkCol=precision>0.85?'#ffdd44':precision>0.5?'#ffaa66':'#aaaaaa';
        for(let i=0;i<sparkCount;i++)spawnSparkle(hp.x,hp.y+(Math.random()-0.5)*hp.r,sparkCol);
      }
    }
  }
}

function triggerCrash(){
  if(pl.hearts>0){
    spawnCrashHearts(pl.x-scrollX+pl.w/2,pl.y+pl.h/2,pl.hearts);
    document.getElementById('crash-sub').textContent='you lost '+pl.hearts+' heart'+(pl.hearts!==1?'s':'');
  }
  pl.crashed=true;pl.crashTimer=0;pl.hearts=0;pl.multiplier=1;pl.multiTimer=0;
}

function updateCamera(){
  if(pl.crashed)return;
  camX=lerp(camX,pl.x-W*0.25,0.08);
  scrollX=Math.max(scrollX,camX);
  scrollX=clamp(scrollX,0,WORLD_WIDTH-W*0.8);
}

// ═══ HEART SHAPE ═══
function heartPath(cx,cy,s){
  const w=s,h=s*1.15;
  ctx.moveTo(cx,cy+h*0.35);
  ctx.bezierCurveTo(cx-w*0.01,cy+h*0.2,cx-w*0.55,cy-h*0.05,cx-w*0.35,cy-h*0.3);
  ctx.bezierCurveTo(cx-w*0.12,cy-h*0.5,cx-w*0.01,cy-h*0.2,cx,cy-h*0.05);
  ctx.bezierCurveTo(cx+w*0.01,cy-h*0.2,cx+w*0.12,cy-h*0.5,cx+w*0.35,cy-h*0.3);
  ctx.bezierCurveTo(cx+w*0.55,cy-h*0.05,cx+w*0.01,cy+h*0.2,cx,cy+h*0.35);
}

// ═══ CACHED SKY GRADIENT ═══

function drawSky(prog){
  // Cache gradient — only rebuild when colors shift noticeably
  const key=zc[0]+','+zc[1]+','+zc[2]+','+zc[3]+','+zc[4]+','+zc[5];
  if(key!==cachedSkyKey){
    cachedSkyKey=key;
    cachedSkyGrad=ctx.createLinearGradient(0,0,0,H);
    cachedSkyGrad.addColorStop(0,'rgb('+zc[0]+','+zc[1]+','+zc[2]+')');
    cachedSkyGrad.addColorStop(1,'rgb('+zc[3]+','+zc[4]+','+zc[5]+')');
  }
  ctx.fillStyle=cachedSkyGrad;
  ctx.fillRect(0,0,W,H);

  // ─── TUNNEL: single dark overlay instead of multiple ───
  if(prog<ESCAPE_BLOOM_END){
    const tA=prog<TUNNEL_END?1:1-clamp((prog-TUNNEL_END)/(ESCAPE_BLOOM_END-TUNNEL_END),0,1);
    if(tA>0.01){
      // Combine tunnel darkness + fire flicker into one fill
      const fireAdd=prog<TUNNEL_END?(0.03+Math.sin(frame*0.08)*0.01+bassE*0.04):0;
      const r=Math.min(255,(fireAdd*255)|0);
      ctx.fillStyle='rgba('+r+',0,0,'+tA*0.7+')';
      ctx.fillRect(0,0,W,H);
    }
  }

  // ─── ESCAPE BLOOM — single fill ───
  if(prog>=TUNNEL_END&&prog<ESCAPE_BLOOM_END){
    const bloomT=clamp((prog-TUNNEL_END)/(ESCAPE_BLOOM_END-TUNNEL_END),0,1);
    const bloomI=Math.sin(bloomT*Math.PI)*0.4;
    if(bloomI>0.02){
      ctx.fillStyle='rgba(255,250,240,'+bloomI+')';
      ctx.fillRect(0,0,W,H);
    }
  }

  // ─── RISING SUN — 2 circles max, skip tiny alpha ───
  if(prog>=TUNNEL_END){
    const sunProg=clamp((prog-TUNNEL_END)/(0.6-TUNNEL_END),0,1);
    const sunAlpha=clamp(sunProg*1.5,0,0.9);
    if(sunAlpha>0.03){
      const sunY=lerp(H*0.85,H*0.18,sunProg);
      const sunX=W*0.75;
      const sunR=30+sunProg*40;
      // Outer glow — single circle, moderate size
      ctx.fillStyle='rgba(255,210,110,'+sunAlpha*0.12+')';
      ctx.beginPath();ctx.arc(sunX,sunY,sunR*3,0,Math.PI*2);ctx.fill();
      // Sun disc + core in one path
      ctx.fillStyle='rgba(255,240,200,'+sunAlpha*0.85+')';
      ctx.beginPath();ctx.arc(sunX,sunY,sunR,0,Math.PI*2);ctx.fill();
    }
  }

  // ─── STARS — batched into single path ───
  if(prog>0.7){
    const sa=clamp((prog-0.7)/0.3,0,1);
    ctx.fillStyle='rgba(255,255,240,'+sa*0.5+')';
    ctx.beginPath();
    for(let i=0;i<40;i++){
      const sx=((i*317+frame*0.01)%W),sy=((i*197+i*i*3)%(H*0.4));
      const r=0.8+(i%3)*0.3;
      ctx.moveTo(sx+r,sy);ctx.arc(sx,sy,r,0,Math.PI*2);
    }
    ctx.fill();
  }

  // ─── GOLDEN RIM ───
  if(prog>0.8){
    const ga=clamp((prog-0.8)/0.2,0,1);
    if(ga>0.02){ctx.fillStyle='rgba(255,220,120,'+ga*0.08+')';ctx.fillRect(0,0,W,H*0.5)}
  }

  // ─── EMBERS — batched into single path ───
  if(prog<TUNNEL_END+0.05){
    const ea=clamp(1-prog/(TUNNEL_END+0.05),0,1);
    ctx.fillStyle='rgba(255,70,0,'+ea*0.6+')';
    ctx.beginPath();
    for(let i=0;i<20;i++){
      const ex=((frame*0.6+i*97)%W),ey=H-((frame*1.5+i*63)%(H*0.7));
      const r=1+Math.sin(frame*0.05+i)*0.6;
      ctx.moveTo(ex+r,ey);ctx.arc(ex,ey,r,0,Math.PI*2);
    }
    ctx.fill();
  }

  // Beat flash — only outside tunnel, skip if tiny
  if(beat>0.06&&prog>=TUNNEL_END){ctx.fillStyle='rgba(255,255,255,'+beat*0.02+')';ctx.fillRect(0,0,W,H)}
}

// ═══ TUNNEL CEILING ═══
function drawTunnel(prog){
  if(prog>=ESCAPE_BLOOM_END)return;
  const tA=prog<TUNNEL_END?1:1-clamp((prog-TUNNEL_END)/(ESCAPE_BLOOM_END-TUNNEL_END),0,1);
  if(tA<0.01)return;

  const cy=ceilingY(prog);

  ctx.save();ctx.globalAlpha=tA;

  // Ceiling slab
  ctx.fillStyle='rgb(8,3,2)';
  ctx.fillRect(0,0,W,cy);

  // Stalactite edge — batched single path
  ctx.fillStyle='rgba(15,5,2,0.9)';
  ctx.beginPath();
  for(let i=0;i<16;i++){
    const sx=((scrollX*0.4+i*130)%W);
    const sh=8+(i*31%20);
    ctx.moveTo(sx-8,cy);ctx.lineTo(sx,cy+sh);ctx.lineTo(sx+8,cy);
  }
  ctx.fill();

  // Fire cracks — batched single stroke
  const crackA=0.3+bassE*0.3;
  if(crackA>0.05){
    ctx.strokeStyle='rgba(255,80,0,'+crackA+')';ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const fx=((scrollX*0.3+i*200)%W);
      ctx.moveTo(fx,cy-2);ctx.lineTo(fx+5+Math.sin(frame*0.1+i)*3,cy+4);
    }
    ctx.stroke();
  }

  ctx.restore();
}

// ═══ GROUND ═══
function drawGround(prog){
  const gy=groundY(prog);
  ctx.fillStyle='rgb('+zc[6]+','+zc[7]+','+zc[8]+')';
  ctx.fillRect(0,gy,W,H-gy+5);

  const z=zoneAt(prog);

  if(z===0){
    // Lava strokes — batched
    ctx.strokeStyle='rgba(255,100,0,0.6)';ctx.lineWidth=3;
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const lx=((scrollX*0.3+i*180)%(W+100))-50;
      ctx.moveTo(lx,gy+3);ctx.bezierCurveTo(lx+20,gy+15,lx+40,gy+8,lx+60,gy+20);
    }
    ctx.stroke();
    ctx.fillStyle='rgba(255,40,0,'+(0.15+bassE*0.15)+')';
    ctx.fillRect(0,gy-15,W,15);
  }else if(z===2){
    ctx.save();ctx.globalAlpha=0.4;
    const colors=['rgba(90,160,50,0.7)','rgba(120,170,55,0.7)','rgba(170,165,50,0.7)','rgba(80,140,45,0.7)','rgba(200,190,70,0.7)'];
    for(let i=0;i<15;i++){
      const fx=((scrollX*0.25+i*107)%(W+80))-40;
      const fy=gy+4+(i*17%30);
      ctx.fillStyle=colors[i%5];
      ctx.fillRect(fx,fy,30+(i*23%40),15+(i*11%20));
    }
    ctx.restore();
  }else if(z===3){
    ctx.save();ctx.globalAlpha=0.4;
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const mx=((scrollX*0.2+i*130)%(W+120))-60;
      const mh=25+(i*37%50);
      ctx.moveTo(mx,gy);ctx.lineTo(mx+20+i*3,gy-mh);ctx.lineTo(mx+40+i*6,gy);
    }
    ctx.fillStyle='rgba(150,155,165,0.6)';ctx.fill();
    // Snow caps — batched
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const mx=((scrollX*0.2+i*130)%(W+120))-60;
      const mh=25+(i*37%50);
      ctx.moveTo(mx+15+i*2,gy-mh+8);ctx.lineTo(mx+20+i*3,gy-mh);ctx.lineTo(mx+25+i*4,gy-mh+8);
    }
    ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fill();
    ctx.restore();
  }else if(z===4){
    ctx.save();ctx.globalAlpha=0.3;
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillRect(0,gy-10,W,30);
    for(let i=0;i<8;i++){
      const cx=((scrollX*0.12+i*160)%(W+200))-100;
      const ccy=gy-5+Math.sin(i*1.7+frame*0.006)*6;
      drawCloudShape(cx,ccy,0.9+(i%3)*0.15,0.3);
    }
    ctx.restore();
  }

  // Accent line
  ctx.fillStyle='rgba('+zc[9]+','+zc[10]+','+zc[11]+','+(0.4+beat*0.3)+')';
  ctx.fillRect(0,gy-1,W,2);
}

function drawCloudShape(x,y,scale,opacity){
  if(opacity<0.02)return;
  ctx.save();ctx.globalAlpha=opacity;ctx.fillStyle='#fff';
  const s=scale;
  ctx.beginPath();
  ctx.arc(x,y,26*s,0,Math.PI*2);
  ctx.arc(x+22*s,y-5*s,20*s,0,Math.PI*2);
  ctx.arc(x-18*s,y+3*s,18*s,0,Math.PI*2);
  ctx.arc(x+10*s,y+9*s,15*s,0,Math.PI*2);
  ctx.fill();ctx.restore();
}

function drawClouds(prog){
  for(let i=0;i<clouds.length;i++){
    const c=clouds[i];
    const parallax=c.layer==='far'?0.12:0.35;
    const sx=c.x-scrollX*parallax;
    const wrapped=((sx%(W+300))+(W+300))%(W+300)-150;
    if(wrapped<-80||wrapped>W+80)continue;
    let cyy=c.y;
    if(prog>0.75)cyy=lerp(c.y,groundY(prog)-15+(c.seed%30),clamp((prog-0.75)/0.15,0,1));
    const drift=Math.sin(frame*0.004+c.seed*0.1)*4;
    drawCloudShape(wrapped,cyy+drift,c.scale,c.opacity);
  }
}

// ═══ OBSTACLES ═══
function drawObstacles(prog){
  for(let oi=0;oi<obstacles.length;oi++){
    const ob=obstacles[oi];
    const sx=ob.x-scrollX;
    if(sx<-100||sx>W+100)continue;

    if(ob.mountain){
      const gy=groundY(prog);
      ctx.fillStyle='rgba(120,125,135,0.8)';
      ctx.beginPath();ctx.moveTo(sx,gy);ctx.lineTo(sx+ob.w/2,gy-ob.h);ctx.lineTo(sx+ob.w,gy);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.beginPath();ctx.moveTo(sx+ob.w*0.35,gy-ob.h+8);ctx.lineTo(sx+ob.w/2,gy-ob.h);ctx.lineTo(sx+ob.w*0.65,gy-ob.h+8);ctx.closePath();ctx.fill();
    }else if(ob.tunnel){
      const obProg=clamp(ob.x/WORLD_WIDTH,0,1);
      if(obProg>=ESCAPE_BLOOM_END)continue;
      const tunnelA=obProg<TUNNEL_END?1:1-clamp((obProg-TUNNEL_END)/(ESCAPE_BLOOM_END-TUNNEL_END),0,1);
      if(tunnelA<0.02)continue;
      ctx.save();ctx.globalAlpha=tunnelA;
      ctx.fillStyle='rgb(20,8,4)';
      if(ob.fromCeiling){
        ctx.beginPath();ctx.moveTo(sx-ob.w/2,ob.y);ctx.lineTo(sx,ob.y+ob.h);ctx.lineTo(sx+ob.w/2,ob.y);ctx.closePath();ctx.fill();
      }else{
        ctx.beginPath();ctx.moveTo(sx-ob.w/2,ob.y);ctx.lineTo(sx,ob.y-ob.h);ctx.lineTo(sx+ob.w/2,ob.y);ctx.closePath();ctx.fill();
      }
      ctx.restore();
    }
  }
}

// ═══ HOOPS ═══
function drawHoops(){
  for(let hi=0;hi<hoops.length;hi++){
    const hp=hoops[hi];
    const sx=hp.x-scrollX;
    if(sx<-80||sx>W+80)continue;

    hp.flash=Math.max(0,hp.flash-0.025);
    if(hp.precisionTimer>0)hp.precisionTimer=Math.max(0,hp.precisionTimer-0.015);

    ctx.save();ctx.translate(sx,hp.y);

    // Precision glow — only if active
    if(hp.precisionTimer>0.02){
      const pt=hp.precisionTimer;
      const a=hp.precision>0.85?pt*0.5:hp.precision>0.5?pt*0.3:pt*0.15;
      const r=hp.precision>0.85?255:hp.precision>0.5?255:180;
      const g=hp.precision>0.85?220:hp.precision>0.5?160:180;
      const b=hp.precision>0.85?80:(hp.precision>0.5?80:180);
      ctx.strokeStyle='rgba('+r+','+g+','+b+','+a+')';
      ctx.lineWidth=3+pt*6;
      ctx.beginPath();ctx.ellipse(0,0,10+pt*5,hp.r+pt*8,0,0,Math.PI*2);ctx.stroke();
    }

    // Main ring
    if(hp.passed){
      if(hp.flash>0.02){
        ctx.strokeStyle='rgba(255,255,200,'+hp.flash+')';
        ctx.lineWidth=4+hp.flash*6;
        ctx.beginPath();ctx.ellipse(0,0,8,hp.r,0,0,Math.PI*2);ctx.stroke();
      }
    }else{
      ctx.strokeStyle='rgba(255,210,60,0.85)';ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(0,0,8,hp.r,0,0,Math.PI*2);ctx.stroke();
      // Inner ring
      ctx.strokeStyle='rgba(255,230,100,0.35)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(4,0,5,hp.r*0.85,0,0,Math.PI*2);ctx.stroke();
      // Center line hint
      ctx.strokeStyle='rgba(255,255,100,0.12)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(10,0);ctx.stroke();
      // Heart icon
      ctx.fillStyle='rgba(255,100,150,0.45)';
      ctx.beginPath();heartPath(0,0,10);ctx.fill();
    }

    ctx.restore();
  }
}

// ═══ HEARTS ═══
function drawHearts(){
  for(let hi=0;hi<hearts.length;hi++){
    const h=hearts[hi];
    if(h.collected)continue;
    const sx=h.x-scrollX;
    if(sx<-30||sx>W+30)continue;
    const bob=Math.sin(frame*0.04+h.phase)*5;
    const pulse=1+Math.sin(frame*0.06+h.phase)*0.1;
    ctx.save();ctx.translate(sx,h.y+bob);ctx.scale(pulse,pulse);
    ctx.fillStyle='#ff5588';
    ctx.beginPath();heartPath(0,0,11);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath();ctx.arc(-3,-5,2.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

// ═══ PLANE ═══
function drawPlane(){
  if(pl.crashed&&pl.crashTimer>60)return;
  const sx=pl.x-scrollX,sy=pl.y;
  ctx.save();ctx.translate(sx+pl.w/2,sy+pl.h/2);ctx.rotate(pl.tilt);
  if(pl.invince>0&&(frame&3)<2){ctx.restore();return}

  // Heart glow — simple circle, skip if no hearts
  if(pl.hearts>3){
    const intensity=Math.min(0.12,pl.hearts*0.003);
    ctx.fillStyle='rgba(255,140,180,'+intensity+')';
    ctx.beginPath();ctx.arc(0,0,28+pl.hearts*0.25,0,Math.PI*2);ctx.fill();
  }

  // Multiplier glow — simple circle
  if(pl.multiplier>1&&pl.multiTimer>0){
    const mAlpha=pl.multiTimer/180*0.15;
    ctx.fillStyle=pl.multiplier>=4?'rgba(255,220,80,'+mAlpha+')':'rgba(255,180,120,'+mAlpha+')';
    ctx.beginPath();ctx.arc(0,0,36,0,Math.PI*2);ctx.fill();
  }

  // Body
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(2,0,pl.w/2,pl.h/2,0,0,Math.PI*2);ctx.fill();
  // Nose
  ctx.fillStyle='#ffaacc';
  ctx.beginPath();ctx.ellipse(pl.w/2-2,0,8,pl.h/2-2,0,-Math.PI/2,Math.PI/2);ctx.fill();
  // Wings — single path for both
  ctx.fillStyle='#ffd4e8';
  ctx.beginPath();
  ctx.moveTo(-5,-2);ctx.lineTo(-10,-pl.h-6);ctx.lineTo(8,-2);
  ctx.moveTo(-5,2);ctx.lineTo(-10,pl.h+6);ctx.lineTo(8,2);
  ctx.fill();
  // Tail — single path for both
  ctx.fillStyle='#ffbbdd';
  ctx.beginPath();
  ctx.moveTo(-pl.w/2+2,-1);ctx.lineTo(-pl.w/2-8,-10);ctx.lineTo(-pl.w/2+6,-1);
  ctx.moveTo(-pl.w/2+2,1);ctx.lineTo(-pl.w/2-8,10);ctx.lineTo(-pl.w/2+6,1);
  ctx.fill();
  // Cockpit
  ctx.fillStyle='rgba(150,200,255,0.6)';
  ctx.beginPath();ctx.arc(8,0,5,0,Math.PI*2);ctx.fill();
  // Propeller
  ctx.strokeStyle='#ddd';ctx.lineWidth=2;ctx.lineCap='round';
  const pa=frame*0.5;
  ctx.beginPath();ctx.moveTo(pl.w/2+3+Math.cos(pa)*8,Math.sin(pa)*3);
  ctx.lineTo(pl.w/2+3-Math.cos(pa)*8,-Math.sin(pa)*3);ctx.stroke();
  // Heart emblem
  if(pl.hearts>0){ctx.fillStyle='#ff5588';ctx.beginPath();heartPath(-2,0,5);ctx.fill()}

  ctx.restore();

  // Heart trail — rate-limited
  if(pl.hearts>5&&(frame&3)===0&&!pl.crashed){
    spawnSparkle(pl.x-5+Math.random()*10,pl.y+pl.h/2+(Math.random()-0.5)*10,pl.hearts>50?'#ffaa44':'#ff88bb');
  }
}

// ═══ PARTICLES ═══
function drawCrashParticles(){
  for(let i=crashParticles.length-1;i>=0;i--){
    const p=crashParticles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.007;p.rot+=p.rotSpd;p.vx*=0.99;
    if(p.life<=0){crashParticles.splice(i,1);continue}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=p.life;
    ctx.fillStyle='#ff5588';ctx.beginPath();heartPath(0,0,p.sz*p.life);ctx.fill();ctx.restore();
  }
}

function drawSparkles(){
  if(!sparkles.length)return;
  // Group by color to reduce state changes
  const groups={};
  for(let i=sparkles.length-1;i>=0;i--){
    const s=sparkles[i];
    s.x+=s.vx;s.y+=s.vy;s.life-=0.025;s.vy+=0.02;
    if(s.life<=0){sparkles.splice(i,1);continue}
    if(!groups[s.col])groups[s.col]=[];
    groups[s.col].push(s);
  }
  for(const col in groups){
    const arr=groups[col];
    ctx.fillStyle=col;
    for(let i=0;i<arr.length;i++){
      const s=arr[i];
      ctx.globalAlpha=s.life;
      ctx.beginPath();ctx.arc(s.x,s.y,s.sz*s.life,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

function drawFloatingTexts(){
  for(let i=floatingTexts.length-1;i>=0;i--){
    const t=floatingTexts[i];
    t.y+=t.vy;t.life-=0.012;
    if(t.life<=0){floatingTexts.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=Math.min(1,t.life*2);
    ctx.fillStyle=t.col;
    ctx.font='bold '+t.sz+'px "Bebas Neue",sans-serif';
    ctx.textAlign='center';
    ctx.fillText(t.text,t.x,t.y);
    ctx.restore();
  }
}

// ═══ CAPTIONS ═══
const captions=[
  {s:0,p:0.03,e:0.08,text:'ESCAPE',col:'rgba(255,80,40,0.9)'},
  {s:0.11,p:0.15,e:0.22,text:'FREEDOM',col:'rgba(255,240,200,0.9)'},
  {s:0.25,p:0.30,e:0.38,text:'DAYLIGHT',col:'rgba(180,230,200,0.8)'},
  {s:0.40,p:0.45,e:0.52,text:'THE WORLD BELOW',col:'rgba(120,200,140,0.75)'},
  {s:0.55,p:0.58,e:0.65,text:'HIGHER',col:'rgba(140,190,255,0.8)'},
  {s:0.68,p:0.72,e:0.78,text:'AMONG THE PEAKS',col:'rgba(200,220,255,0.8)'},
  {s:0.80,p:0.85,e:0.92,text:'ABOVE IT ALL',col:'rgba(255,220,150,0.85)'},
  {s:0.93,p:0.96,e:1.0,text:'YOU ARE FREE',col:'rgba(255,200,180,0.9)'}
];

let captionFontSize=40;
function drawCaptions(prog){
  for(let i=0;i<captions.length;i++){
    const c=captions[i];
    if(prog<c.s||prog>c.e)continue;
    const a=prog<c.p?clamp((prog-c.s)/(c.p-c.s),0,1):clamp((c.e-prog)/(c.e-c.p),0,1);
    if(a<0.02)continue;
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle=c.col;
    ctx.font=captionFontSize+'px "Bebas Neue",sans-serif';
    ctx.textAlign='center';ctx.fillText(c.text,W/2,H*0.3);ctx.restore();
  }
}

// ═══ HUD ═══
function drawHeartsHUD(){
  const hx=18,hy=50;
  ctx.fillStyle='#ff5588';ctx.beginPath();heartPath(hx+10,hy,14);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.font='bold '+clamp(W*0.03,16,28)+'px "Bebas Neue",sans-serif';
  ctx.textAlign='left';ctx.fillText(pl.hearts,hx+28,hy+7);
  if(pl.multiplier>1){
    const mAlpha=clamp(pl.multiTimer/60,0,1);
    ctx.fillStyle=pl.multiplier>=4?'rgba(255,220,80,'+mAlpha+')':'rgba(255,180,120,'+mAlpha+')';
    ctx.font='bold '+clamp(W*0.025,14,22)+'px "Bebas Neue",sans-serif';
    ctx.fillText('x'+pl.multiplier,hx+28+ctx.measureText(String(pl.hearts)).width+12,hy+7);
  }
}

const zoneColors=['#881100','#ffaa44','#88ddaa','#88bbff','#ffcc66'];
const zoneNames=['the tunnel','emergence','countryside','highlands','above the clouds'];

function updateHUD(){
  const z=zoneAt(songProgress);
  const pf=document.getElementById('progress-bar-fill');
  pf.style.width=(songProgress*100)+'%';
  pf.style.background=zoneColors[z];
  document.getElementById('progress-label').textContent=zoneNames[z];
  document.getElementById('rewind-btn').classList.toggle('active',rewindHeld);
}

// ═══ MAIN LOOP ═══
let gameRunning=false,gameEnded=false;

function loop(){
  if(!gameRunning)return;
  requestAnimationFrame(loop);

  const prog=songProgress;
  getZC(prog);
  captionFontSize=clamp(W*0.07,30,80);

  if(!gameEnded){
    if(rewindHeld&&history.length>0){
      if(!rewinding){rewinding=true;rewindFrameCount=0}
      rewindFrameCount++;
      if(rewindFrameCount%REWIND_RATE===0){
        popHistory();
        for(let i=0;i<hearts.length;i++){if(hearts[i].x>pl.x+pl.w){hearts[i].collected=false;hearts[i].magnet=0}}
        for(let i=0;i<hoops.length;i++){if(hoops[i].x>pl.x+pl.w){hoops[i].passed=false;hoops[i].flash=0;hoops[i].precisionTimer=0}}
      }
    }else{if(rewinding)rewinding=false}

    if(!rewinding&&!pl.crashed){pushHistory();physicsUpdate();updateCamera();frame++}
    else if(!rewinding&&pl.crashed){pl.crashTimer++}

    updateSongFromScroll();
    if(songProgress>=0.98&&!gameEnded){
      gameEnded=true;
      document.getElementById('end-hearts').textContent='♥ '+pl.hearts;
      document.getElementById('end-screen').classList.add('show');
    }
  }

  drawSky(prog);
  drawClouds(prog);
  drawGround(prog);
  drawTunnel(prog);
  drawObstacles(prog);
  drawHoops();
  drawHearts();
  drawPlane();
  drawCrashParticles();
  drawSparkles();
  drawFloatingTexts();
  drawCaptions(prog);
  drawHeartsHUD();
  if(isTouchDevice&&moveTouchId!==null){
    const dx=moveCurrentX-moveStartX,dy=moveCurrentY-moveStartY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>15){
      ctx.save();ctx.globalAlpha=clamp(dist/80,0.05,0.3);
      ctx.strokeStyle='rgba(255,180,220,0.5)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(moveStartX,moveStartY);ctx.lineTo(moveStartX+dx*0.4,moveStartY+dy*0.4);ctx.stroke();
      ctx.restore();
    }
  }

  updateHUD();
  audioTick();

  if(pl.crashed&&pl.crashTimer>80&&!rewinding&&crashParticles.length<10){
    document.getElementById('crash-screen').classList.add('show');
  }
}

// ═══ BOOT ═══
function startGame(){
  generateWorld();resetPlane();
  history=[];scrollX=0;camX=0;frame=0;crashParticles=[];sparkles=[];floatingTexts=[];
  scrubTargetSample=0;scrubCurrentSample=0;scrubRate=0;prevTargetSample=0;
  gameEnded=false;cachedSkyKey='';
  document.getElementById('crash-screen').classList.remove('show');
  document.getElementById('end-screen').classList.remove('show');
  document.getElementById('hud').classList.add('on');
  gameRunning=true;loop();
}

// ═══ MOBILE CONTROLS ═══
let moveTouchId=null,moveStartX=0,moveStartY=0,moveCurrentX=0,moveCurrentY=0;
const STEER_DEADZONE=15;
const isTouchDevice='ontouchstart' in window||navigator.maxTouchPoints>0;

if(isTouchDevice)document.getElementById('move-hint').style.display='block';

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(moveTouchId===null){moveTouchId=t.identifier;moveStartX=t.clientX;moveStartY=t.clientY;moveCurrentX=t.clientX;moveCurrentY=t.clientY}
  }
},{passive:false});

canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===moveTouchId){
      moveCurrentX=t.clientX;moveCurrentY=t.clientY;
      const dy=moveCurrentY-moveStartY;
      touchState.up=dy<-STEER_DEADZONE;touchState.down=dy>STEER_DEADZONE;
    }
  }
},{passive:false});

canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){if(t.identifier===moveTouchId){moveTouchId=null;touchState.up=false;touchState.down=false}}
},{passive:false});
canvas.addEventListener('touchcancel',()=>{moveTouchId=null;touchState.up=false;touchState.down=false});

// ═══ REWIND & CRASH BUTTONS ═══
function setRewindHeld(v){
  rewindHeld=v;
  document.getElementById('rewind-btn').classList.toggle('active',v);
  document.getElementById('crash-rewind-btn').classList.toggle('active',v);
}

const crb=document.getElementById('crash-rewind-btn');
crb.addEventListener('mousedown',e=>{e.preventDefault();document.getElementById('crash-screen').classList.remove('show');setRewindHeld(true)});
crb.addEventListener('touchstart',e=>{e.preventDefault();document.getElementById('crash-screen').classList.remove('show');setRewindHeld(true)},{passive:false});
addEventListener('mouseup',()=>{if(rewindHeld)setRewindHeld(false)});
addEventListener('touchend',e=>{if(rewindHeld&&e.touches.length===0)setRewindHeld(false)});

const rwb=document.getElementById('rewind-btn');
rwb.addEventListener('mousedown',e=>{e.preventDefault();setRewindHeld(true)});
rwb.addEventListener('touchstart',e=>{e.preventDefault();setRewindHeld(true)},{passive:false});

document.getElementById('crash-continue').addEventListener('click',()=>{
  document.getElementById('crash-screen').classList.remove('show');
  pl.crashed=false;pl.crashTimer=0;pl.invince=240;
  pl.y=Math.min(pl.y,groundY(songProgress)-120);pl.vy=-3;
});

document.getElementById('end-replay').addEventListener('click',()=>{startGame()});

// ═══ LOAD & START ═══
document.getElementById('start-btn').addEventListener('click',async()=>{
  const btn=document.getElementById('start-btn');
  const pw=document.getElementById('prog-wrap'),pf=document.getElementById('prog-fill'),lt=document.getElementById('load-txt');
  btn.style.display='none';pw.style.display='block';lt.style.display='block';lt.textContent='loading song...';

  try{
    const res=await fetch('https://yoobalandgame.com/okay.mp3');
    const total=parseInt(res.headers.get('Content-Length')||'0');
    const reader=res.body.getReader();let received=0;const chunks=[];
    while(true){const{done,value}=await reader.read();if(done)break;chunks.push(value);received+=value.length;if(total)pf.style.width=Math.min(95,received/total*100)+'%'}
    pf.style.width='97%';lt.textContent='decoding...';
    const blob=new Blob(chunks,{type:'audio/mpeg'}),ab=await blob.arrayBuffer();
    audioCtx=new(AudioContext||webkitAudioContext)();if(audioCtx.state==='suspended')await audioCtx.resume();
    analyser=audioCtx.createAnalyser();analyser.fftSize=256;freqLen=analyser.frequencyBinCount;
    freqData=new Uint8Array(freqLen);
    decodedBuffer=await audioCtx.decodeAudioData(ab);songDuration=decodedBuffer.duration;
    pf.style.width='100%';lt.textContent='ready';
    WORLD_WIDTH=Math.ceil(MOVE_SPD*60*songDuration);
    initScrubAudio();
    document.getElementById('overlay').classList.add('gone');
    setTimeout(()=>document.getElementById('overlay').style.display='none',900);
    startGame();
  }catch(e){lt.textContent='error: '+e.message;btn.style.display='block';pw.style.display='none';console.error(e)}
});
</script>
