<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Alien Room</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;touch-action:none;}
canvas{display:block;}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  font-family:monospace;font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.18);
  pointer-events:none;text-align:center;}
#loading{position:fixed;inset:0;background:#010106;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:10;}
#loading p{font-family:monospace;font-size:9px;letter-spacing:6px;color:rgba(180,255,200,.3);}
#load-bar{width:160px;height:1px;background:rgba(255,255,255,.07);}
#load-fill{height:100%;width:0%;background:rgba(150,255,180,.5);transition:width .08s;}
</style>
</head>
<body>
<div id="loading"><p>LOADING RECORD</p><div id="load-bar"><div id="load-fill"></div></div></div>
<div id="hint">click floor to walk &nbsp;·&nbsp; click record player for music</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── RENDERER ──────────────────────────────────
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.body.appendChild(renderer.domElement);
window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020206);
scene.fog=new THREE.Fog(0x020206,12,25);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,40);
camera.position.set(0,9.8,13.5);
camera.lookAt(0,0.6,0);

// ── MATERIAL HELPERS ──────────────────────────
const Ph=(col,shin=40,em=0x000000,spec=0x111111)=>new THREE.MeshPhongMaterial({color:col,shininess:shin,emissive:em,specular:spec});
const Ba=c=>new THREE.MeshBasicMaterial({color:c});
const Em=(col,i=1.0)=>new THREE.MeshPhongMaterial({color:col,emissive:new THREE.Color(col),emissiveIntensity:i,shininess:5});

// ── LIGHTS ────────────────────────────────────
scene.add(new THREE.AmbientLight(0x141830,0.6));

const mainL=new THREE.PointLight(0xffddaa,1.8,20);
mainL.position.set(0,6.5,0);mainL.castShadow=true;
mainL.shadow.mapSize.set(1024,1024);mainL.shadow.radius=4;
scene.add(mainL);

const rpLight=new THREE.PointLight(0xff2255,0,7);
rpLight.position.set(-3.8,2.2,0.5);scene.add(rpLight);

const lapLight=new THREE.PointLight(0x2244ff,0.8,6);
lapLight.position.set(3.6,2.2,-2.5);scene.add(lapLight);

const ledL=new THREE.PointLight(0x00ffee,0.6,10);
ledL.position.set(-5.5,6.2,0);scene.add(ledL);
const ledR=new THREE.PointLight(0x9933ff,0.6,10);
ledR.position.set(5.5,6.2,0);scene.add(ledR);

const moonL=new THREE.PointLight(0x5577cc,0.7,9);
moonL.position.set(-5.2,4.2,-1);scene.add(moonL);

const signL=new THREE.PointLight(0xff44aa,0.5,5);
signL.position.set(-0.5,5.0,-5.2);scene.add(signL);

const discoArm=new THREE.Group();
discoArm.position.set(0,5.5,-0.5);scene.add(discoArm);
const dL1=new THREE.PointLight(0xff44cc,0,9);dL1.position.set(2.5,0,0);discoArm.add(dL1);
const dL2=new THREE.PointLight(0x44ffcc,0,9);dL2.position.set(-2.5,0,0);discoArm.add(dL2);
const dL3=new THREE.PointLight(0xffaa00,0,9);dL3.position.set(0,0,2.5);discoArm.add(dL3);

// ── STORY LIGHTS ─────────────────────────────
// 6 lights that turn on in sequence to tell the light story
const SL=[];
[{p:[0,5.5,-5.5],c:0xff44bb,r:15},   // 0 back-top pink
 {p:[-4.5,4.5,1],c:0x44eeff,r:13},   // 1 left teal
 {p:[4.5,4.5,1],c:0xff7700,r:13},    // 2 right amber
 {p:[0,2.8,4.5],c:0x4455ff,r:11},    // 3 front floor blue
 {p:[-2.5,5,3],c:0xffee00,r:12},     // 4 front-left gold
 {p:[2.5,5,3],c:0xcc44ff,r:12},      // 5 front-right purple
].forEach(({p,c,r})=>{
  const l=new THREE.PointLight(c,0,r);
  l.position.set(...p);scene.add(l);SL.push(l);
});

// ── CANVAS TEXTURES ───────────────────────────
function makeStarTex(){
  const cv=document.createElement('canvas');cv.width=512;cv.height=512;
  const c=cv.getContext('2d');
  c.fillStyle='#03030f';c.fillRect(0,0,512,512);
  const g=c.createRadialGradient(256,200,20,256,200,220);
  g.addColorStop(0,'rgba(80,20,120,.4)');g.addColorStop(.5,'rgba(30,10,60,.2)');g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;c.fillRect(0,0,512,512);
  for(let i=0;i<280;i++){
    const x=Math.random()*512,y=Math.random()*512,r=Math.random()*1.8+0.2;
    c.fillStyle=`rgba(255,${180+Math.random()*75},255,${Math.random()*.7+.3})`;
    c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();
  }
  for(let i=0;i<6;i++){
    const gn=c.createRadialGradient(Math.random()*400+50,Math.random()*300+50,5,Math.random()*400+50,Math.random()*300+50,90);
    gn.addColorStop(0,`hsla(${220+Math.random()*120},80%,55%,.12)`);gn.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=gn;c.fillRect(0,0,512,512);
  }
  return new THREE.CanvasTexture(cv);
}
function makeFloorTex(){
  const cv=document.createElement('canvas');cv.width=512;cv.height=512;
  const c=cv.getContext('2d');
  for(let i=0;i<8;i++){
    c.fillStyle=i%2===0?'#190d05':'#1f1008';c.fillRect(0,i*64,512,64);
    c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=1;
    c.beginPath();c.moveTo(0,i*64);c.lineTo(512,i*64);c.stroke();
    for(let j=0;j<6;j++){
      c.strokeStyle='rgba(0,0,0,.08)';c.lineWidth=0.5;
      c.beginPath();c.moveTo(0,i*64+j*9+4);c.bezierCurveTo(120,i*64+j*9+6,300,i*64+j*9+2,512,i*64+j*9+5);c.stroke();
    }
  }
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,3);return t;
}
function makeNeonSign(txt,col){
  const cv=document.createElement('canvas');cv.width=512;cv.height=96;
  const c=cv.getContext('2d');c.clearRect(0,0,512,96);
  c.font='bold 60px monospace';c.textAlign='center';c.textBaseline='middle';
  c.shadowColor=col;c.shadowBlur=30;c.fillStyle=col;
  for(let i=0;i<4;i++)c.fillText(txt,256,48);
  return new THREE.CanvasTexture(cv);
}
function makeHintTex(){
  const cv=document.createElement('canvas');cv.width=320;cv.height=56;
  const c=cv.getContext('2d');c.clearRect(0,0,320,56);
  c.font='bold 15px monospace';c.textAlign='center';c.textBaseline='middle';
  c.shadowColor='#aaffcc';c.shadowBlur=14;c.fillStyle='rgba(180,255,210,.85)';
  c.fillText('▶  click to play',160,28);
  return new THREE.CanvasTexture(cv);
}
const starTex=makeStarTex(),floorTex=makeFloorTex();

// ── ROOM ──────────────────────────────────────
const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,12),
  new THREE.MeshPhongMaterial({color:0x1a0e06,map:floorTex,shininess:55,specular:0x111108}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const rug=new THREE.Mesh(new THREE.PlaneGeometry(6,4.5),Ph(0x1a0a28,4));
rug.rotation.x=-Math.PI/2;rug.position.set(-0.2,0.003,1.5);scene.add(rug);
const rugB=new THREE.Mesh(new THREE.PlaneGeometry(6.24,4.74),Ph(0x2e1240,3));
rugB.rotation.x=-Math.PI/2;rugB.position.set(-0.2,0.002,1.5);scene.add(rugB);
const wM=Ph(0x080810,4),wM2=Ph(0x070810,4);
const bWall=new THREE.Mesh(new THREE.PlaneGeometry(12,7),wM);
bWall.position.set(0,3.5,-6);scene.add(bWall);
const rWall=new THREE.Mesh(new THREE.PlaneGeometry(12,7),wM2);
rWall.rotation.y=-Math.PI/2;rWall.position.set(6,3.5,0);scene.add(rWall);
[[12,2.2,-0.5,1.1],[12,2.4,-0.5,5.9],[3.5,7,-3.925,3.5],[3.5,7,2.875,3.5]].forEach(([w,h,z,y])=>{
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),wM2);
  m.rotation.y=Math.PI/2;m.position.set(-6,y,z);scene.add(m);
});
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(12,12),Ph(0x050509,3));
ceil.rotation.x=Math.PI/2;ceil.position.y=7;scene.add(ceil);

// Ceiling LED strips
const cLedM=Em(0x00ffee,0.9),cLedM2=Em(0xaa33ff,0.9);
[{x:0,z:-5.97,w:12,d:0.05,m:cLedM},{x:0,z:5.97,w:12,d:0.05,m:cLedM2},
 {x:-5.97,z:0,w:0.05,d:12,m:cLedM},{x:5.97,z:0,w:0.05,d:12,m:cLedM2}].forEach(s=>{
  const strip=new THREE.Mesh(new THREE.BoxGeometry(s.w,0.04,s.d),s.m);
  strip.position.set(s.x,6.96,s.z);scene.add(strip);
});
const shelfLed=new THREE.Mesh(new THREE.BoxGeometry(2,0.03,0.05),Em(0xff9933,0.8));
shelfLed.position.set(-5.1,3.1,-4.8);scene.add(shelfLed);

// Space window
const winW=3.2,winH=2.8,winY=3.4,winZ=0.5;
const winPane=new THREE.Mesh(new THREE.PlaneGeometry(winW,winH),
  new THREE.MeshBasicMaterial({map:starTex}));
winPane.rotation.y=Math.PI/2;winPane.position.set(-5.92,winY,winZ);scene.add(winPane);
const fM=Ph(0x1e1410,35,0x050200,0x2a1a08);
[[0,winH/2+0.07,winW+0.14,0.14],[0,-winH/2-0.07,winW+0.14,0.14],
 [-winW/2-0.07,0,0.14,winH],[winW/2+0.07,0,0.14,winH]].forEach(([fx,fy,fw,fh])=>{
  const fr=new THREE.Mesh(new THREE.BoxGeometry(0.12,fh,fw),fM);
  fr.position.set(-5.95,winY+fy,winZ+fx);fr.rotation.y=Math.PI/2;scene.add(fr);
});
const moonDisc=new THREE.Mesh(new THREE.CircleGeometry(0.22,24),
  new THREE.MeshBasicMaterial({color:0xddeeff}));
moonDisc.rotation.y=Math.PI/2;moonDisc.position.set(-5.91,winY+0.55,winZ-0.9);scene.add(moonDisc);
const moonGlow=new THREE.Mesh(new THREE.CircleGeometry(0.38,24),
  new THREE.MeshBasicMaterial({color:0x7799cc,transparent:true,opacity:0.22}));
moonGlow.rotation.y=Math.PI/2;moonGlow.position.set(-5.915,winY+0.55,winZ-0.9);scene.add(moonGlow);

// Neon signs
const signTex=makeNeonSign('GROOVE','#ff44bb');
const neonSign=new THREE.Mesh(new THREE.PlaneGeometry(2.6,0.5),
  new THREE.MeshBasicMaterial({map:signTex,transparent:true}));
neonSign.position.set(-0.5,5.0,-5.92);scene.add(neonSign);
const sign2Tex=makeNeonSign('♪','#44ffcc');
const neonSign2=new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.5),
  new THREE.MeshBasicMaterial({map:sign2Tex,transparent:true}));
neonSign2.position.set(2.2,4.8,-5.92);scene.add(neonSign2);

// Wall records
const recCols=[0x881122,0x114488,0x228833,0x884422,0x662288];
for(let i=0;i<5;i++){
  const rG=new THREE.Group();rG.position.set(-3+i*1.3,3.9,-5.9);scene.add(rG);
  const rd=new THREE.Mesh(new THREE.CylinderGeometry(0.29,0.29,0.02,28),Ph(0x111111,90,0,0x222220));
  rd.rotation.x=Math.PI/2;rG.add(rd);
  const rl=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.025,16),Ph(recCols[i],15));
  rl.rotation.x=Math.PI/2;rG.add(rl);
  rG.rotation.y=(Math.random()-0.5)*0.4;rG.rotation.z=(Math.random()-0.5)*0.15;
}

// ── RECORD PLAYER CABINET ─────────────────────
const rpCab=new THREE.Group();rpCab.position.set(-3.8,0,0.4);scene.add(rpCab);
const cabM=Ph(0x2e1c0a,30,0x060300,0x1a0c04);
const cab=new THREE.Mesh(new THREE.BoxGeometry(2.1,1.2,1.0),cabM);
cab.position.y=0.6;cab.castShadow=true;rpCab.add(cab);
const cdM=Ph(0x3e2410,22,0x090402,0x221408);
[[-0.53,0.6,0.51],[0.53,0.6,0.51]].forEach(([x,y,z])=>{
  const cd=new THREE.Mesh(new THREE.BoxGeometry(0.98,0.88,0.022),cdM);
  cd.position.set(x,y,z);rpCab.add(cd);
  const groove=new THREE.Mesh(new THREE.BoxGeometry(0.88,0.78,0.005),Ph(0x281408,5));
  groove.position.set(x,y,z+0.013);rpCab.add(groove);
});
[[-0.07,0.6,0.525],[0.07,0.6,0.525]].forEach(([x,y,z])=>{
  const h=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.065),Ph(0x998866,60,0,0x665533));
  h.rotation.z=Math.PI/2;h.position.set(x,y,z);rpCab.add(h);
});
const grille=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.9,0.018),Ph(0x0e0a09,6));
grille.position.set(0,0.6,-0.51);rpCab.add(grille);
[[-0.85,-0.5],[-0.85,0.42],[0.85,-0.5],[0.85,0.42]].forEach(([x,z])=>{
  const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.038,0.36),Ph(0x666658,70,0,0x555548));
  leg.position.set(x,-0.18,z);rpCab.add(leg);
  const tip=new THREE.Mesh(new THREE.SphereGeometry(0.035,7,5),Ph(0x333328,50));
  tip.position.set(x,-0.36,z);rpCab.add(tip);
});

// ── RECORD PLAYER ─────────────────────────────
const rpG=new THREE.Group();rpG.position.set(-3.8,1.2,0.35);scene.add(rpG);
const rpBase=new THREE.Mesh(new THREE.BoxGeometry(1.52,0.1,1.08),Ph(0x2e1e0c,35,0x060300,0x1a0c04));
rpBase.position.y=0.05;rpBase.castShadow=true;rpG.add(rpBase);
const rpSurround=new THREE.Mesh(new THREE.BoxGeometry(1.56,0.022,1.12),Ph(0x999988,80,0,0x555548));
rpSurround.position.y=0.111;rpG.add(rpSurround);
const platG=new THREE.Group();platG.position.set(-0.22,0.12,0.07);rpG.add(platG);
const platBase=new THREE.Mesh(new THREE.CylinderGeometry(0.44,0.44,0.032,40),Ph(0x2a2a28,70,0,0x444440));
platBase.castShadow=true;platG.add(platBase);
const vinyl=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.024,40),Ph(0x0d0d0d,110,0,0x1e1e1c));
vinyl.position.y=0.028;platG.add(vinyl);
for(let r=0;r<5;r++){
  const gv=new THREE.Mesh(new THREE.CylinderGeometry(0.1+r*0.056,0.1+r*0.056,0.026,36,1,true),
    new THREE.MeshPhongMaterial({color:0x141414,shininess:130,specular:0x282826,side:THREE.BackSide}));
  gv.position.y=0.029;platG.add(gv);
}
const vinylLabel=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.028,16),Ph(0xcc1133,20,0x280008));
vinylLabel.position.y=0.03;platG.add(vinylLabel);
const spinParts=[platBase,vinyl,vinylLabel,...platG.children.slice(2,7)];
const taGrp=new THREE.Group();taGrp.position.set(0.52,0.13,-0.34);rpG.add(taGrp);
const taPiv=new THREE.Mesh(new THREE.CylinderGeometry(0.036,0.036,0.08,10),Ph(0xaaaaaa,80,0,0x888880));
taGrp.add(taPiv);
const taSwing=new THREE.Group();taSwing.position.y=0.06;taGrp.add(taSwing);
const taArm=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.014,0.014),Ph(0xbbbbaa,80,0,0x999988));
taArm.position.x=-0.26;taSwing.add(taArm);
const taHead=new THREE.Mesh(new THREE.BoxGeometry(0.072,0.02,0.042),Ph(0x999988,60));
taHead.position.set(-0.54,0,-0.018);taSwing.add(taHead);
const taNeedle=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.003,0.044),Ph(0xaaaaaa,100,0,0xffffff));
taNeedle.position.set(0,-0.028,0);taHead.add(taNeedle);
const TA_REST=0.65,TA_PLAY=0.02;
taSwing.rotation.y=TA_REST;
const knobM=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.058,12),Ph(0x555548,65,0,0x888878));
knobM.position.set(0.58,0.09,0.22);rpG.add(knobM);
const rpMeshes=[rpBase,rpSurround,platBase,vinyl,vinylLabel,taPiv,taArm,taHead,knobM];
[[0xaa2020,0.32],[0x22aa44,0.18]].forEach(([c,z])=>{
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.016,8),Ph(c,25));
  b.position.set(0.58,0.106,z);rpG.add(b);rpMeshes.push(b);
});
const hintTex=makeHintTex();
const hintSign=new THREE.Mesh(new THREE.PlaneGeometry(1.3,0.28),
  new THREE.MeshBasicMaterial({map:hintTex,transparent:true,opacity:0.85,depthWrite:false}));
hintSign.position.set(-3.8,3.1,0.35);scene.add(hintSign);
let hintOpacity=0.85;

// ── DISCO BALL GROUP (starts above ceiling) ───
const discoGroup=new THREE.Group();
discoGroup.position.set(0,2.0,0); // offset pushed UP, descends to 0
scene.add(discoGroup);
const discoBall=new THREE.Mesh(new THREE.SphereGeometry(0.32,28,20),
  new THREE.MeshPhongMaterial({color:0x999999,specular:new THREE.Color(1,1,1),shininess:320}));
discoBall.position.set(0.8,6.32,-0.5);discoGroup.add(discoBall);
const dbCord=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.55),Ph(0x303030,20));
dbCord.position.set(0.8,6.655,-0.5);discoGroup.add(dbCord);
const dbRing=new THREE.Mesh(new THREE.TorusGeometry(0.36,0.024,8,28),
  new THREE.MeshPhongMaterial({color:0x999999,specular:new THREE.Color(1,1,1),shininess:250}));
dbRing.position.set(0.8,6.32,-0.5);discoGroup.add(dbRing);

// ── LAPTOP DESK ───────────────────────────────
const deskG=new THREE.Group();deskG.position.set(3.6,0,-2.2);scene.add(deskG);
const dTop=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.06,1.5),Ph(0x211408,32,0x050200,0x180e04));
dTop.position.y=0.92;dTop.castShadow=true;deskG.add(dTop);
[[-1.1,0.92],[1.1,-0.62],[-1.1,-0.62],[1.1,0.92]].forEach(([x,z])=>{
  const ll=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.92),Ph(0x888880,80,0,0x666660));
  ll.position.set(x,0.46,z);deskG.add(ll);
});
const lapG=new THREE.Group();lapG.position.set(3.6,0.95,-2.7);scene.add(lapG);
const lapBase=new THREE.Mesh(new THREE.BoxGeometry(1.05,0.034,0.72),Ph(0x202028,65,0,0x303038));
lapBase.castShadow=true;lapG.add(lapBase);
const kbA=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.005,0.58),Ph(0x1a1a22,18));
kbA.position.set(0,0.02,0.02);lapG.add(kbA);
for(let r=0;r<4;r++)for(let k=0;k<10;k++){
  const key=new THREE.Mesh(new THREE.BoxGeometry(0.072,0.004,0.058),Ph(0x222230,10));
  key.position.set(-0.38+k*0.086,0.024,-0.2+r*0.1);lapG.add(key);
}
const trackpad=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.004,0.19),Ph(0x26263a,28));
trackpad.position.set(0,0.02,0.23);lapG.add(trackpad);
const lidG=new THREE.Group();lidG.position.set(0,0.017,-0.36);lapG.add(lidG);
const lidMesh=new THREE.Mesh(new THREE.BoxGeometry(1.05,0.64,0.03),Ph(0x202028,65,0,0x303038));
lidMesh.position.set(0,0.32,0.015);lidG.add(lidMesh);
const screen=new THREE.Mesh(new THREE.PlaneGeometry(0.92,0.56),Ba(0x080e20));
screen.position.set(0,0.32,-0.003);lidG.add(screen);
const screenFX=new THREE.Mesh(new THREE.PlaneGeometry(0.90,0.54),
  new THREE.MeshBasicMaterial({color:0x0d22aa,transparent:true,opacity:0.75}));

let audioCtx,analyser,srcNode,freqData;
let bass=0,energy=0,beatImpact=0,prevBass=0,beat=0;
let musicPlaying=false,audioBuffer=null;

async function preloadAudio(){
  try{
    const res=await fetch('https://yoobalandgame.com/nomo.mp3');
    const total=parseInt(res.headers.get('content-length')||'0');
    const rdr=res.body.getReader();let rx=0;const chs=[];
    const fill=document.getElementById('load-fill');
    while(true){const{done,value}=await rdr.read();if(done)break;chs.push(value);rx+=value.length;if(total&&fill)fill.style.width=Math.min(95,rx/total*100)+'%';}
    if(fill)fill.style.width='100%';
    const blob=new Blob(chs,{type:'audio/mpeg'}),ab=await blob.arrayBuffer();
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();analyser.fftSize=256;
    freqData=new Uint8Array(analyser.frequencyBinCount);
    analyser.connect(audioCtx.destination);
    audioBuffer=await audioCtx.decodeAudioData(ab);
    setTimeout(()=>document.getElementById('loading').style.display='none',400);
  }catch(e){document.getElementById('loading').style.display='none';}
}
preloadAudio();

function audioTick(){
  if(!analyser)return;
  analyser.getByteFrequencyData(freqData);
  let b=0,tot=0;const n=freqData.length;
  for(let i=0;i<n;i++){const v=freqData[i]/255;tot+=v;if(i<8)b+=v/8;}
  const bd=b-prevBass;
  if(bd>.065){beat=1;beatImpact=Math.min(1,beatImpact+bd*4.5);}
  prevBass=b;beat=Math.max(0,beat-.048);beatImpact=Math.max(0,beatImpact-.052);
  bass=bass*.78+b*.22;energy=energy*.9+(tot/n)*.1;
}

let musicTime=0; // accumulates while playing, resets on stop

function toggleMusic(){
  if(!audioCtx)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(musicPlaying&&srcNode){try{srcNode.stop();}catch(e){}srcNode=null;musicPlaying=false;musicTime=0;}
  else if(audioBuffer){
    srcNode=audioCtx.createBufferSource();srcNode.buffer=audioBuffer;srcNode.loop=true;
    srcNode.connect(analyser);srcNode.start(0);musicPlaying=true;
  }
}

const raycaster=new THREE.Raycaster();

function onPointer(e){
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  mouse.x=(cx/innerWidth)*2-1;mouse.y=-(cy/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  if(raycaster.intersectObjects(rpMeshes,false).length>0){toggleMusic();return;}
  const pt=new THREE.Vector3();
  if(raycaster.ray.intersectPlane(floorPlane,pt)){
    pt.x=Math.max(-4.5,Math.min(4.5,pt.x));pt.z=Math.max(-4.5,Math.min(5.2,pt.z));
    walkTarget.copy(pt);targetRing.position.set(pt.x,0.005,pt.z);
    targetVisible=1;isMoving=true;
  }
}

// ── ANIMATE ───────────────────────────────────
const clock=new THREE.Clock();
let t=0,spinAngle=0,spinVel=0;
let lightHue=0;          // slowly rotating colour wheel
let discoGroupY=2.2;     // starts above ceiling

// lerp helper
const L=(a,b,t)=>a+(b-a)*t;
// smooth clamp 0-1
const S01=(v,mn,mx)=>Math.max(0,Math.min(1,(v-mn)/(mx-mn)));

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);t+=dt;
  audioTick();
  if(musicPlaying)musicTime+=dt;

  // ── SEQUENCE GATES ────────────────────────
  // 0→2.5s: ball descends (alien idle)
  // 2.5→6s: lights turn on one by one
  // 6s+   : alien dances
  const ballPhase = musicPlaying ? S01(musicTime,0,2.5) : 0;
  const lightPhase= musicPlaying ? S01(musicTime,2.5,7.0) : 0;
  const dancePhase= musicPlaying ? S01(musicTime,5.5,8.0) : 0;

  // ── DISCO BALL DESCENT ────────────────────
  const targetBallY = musicPlaying ? 0 : 2.2;
  discoGroupY = L(discoGroupY, targetBallY, musicPlaying ? 0.022 : 0.035);
  discoGroup.position.y = discoGroupY;

  // Target ring fade
  targetVisible=Math.max(0,targetVisible-dt*0.9);
  targetRing.material.opacity=targetVisible*0.65;

  // ── WALK ──────────────────────────────────
  const diff=new THREE.Vector3(walkTarget.x-alienGroup.position.x,0,walkTarget.z-alienGroup.position.z);
  const dist=diff.length();
  if(isMoving&&dist>0.1){
    const spd=2.5+energy*0.8,step=Math.min(spd*dt,dist),dir=diff.clone().normalize();
    alienGroup.position.x+=dir.x*step;alienGroup.position.z+=dir.z*step;
    const ang=Math.atan2(dir.x,dir.z);
    alienGroup.rotation.y+=((ang-alienGroup.rotation.y+Math.PI)%(Math.PI*2)-Math.PI)*0.14;
    const wt=t*7.5;
    // arms swing front/back from shoulder pivot
    armLG.rotation.x= Math.sin(wt)*0.52;armRG.rotation.x=-Math.sin(wt)*0.52;
    armLG.rotation.z=0.14;armRG.rotation.z=-0.14;
    armLG.userData.eG.rotation.x=-Math.max(0, Math.sin(wt))*0.28;
    armRG.userData.eG.rotation.x=-Math.max(0,-Math.sin(wt))*0.28;
    // legs swing from hip pivot (negative x = forward in local space)
    legLG.rotation.x=-Math.sin(wt)*0.48;legRG.rotation.x= Math.sin(wt)*0.48;
    legLG.userData.kG.rotation.x=Math.max(0, Math.sin(wt+0.5))*0.42;
    legRG.userData.kG.rotation.x=Math.max(0,-Math.sin(wt+0.5))*0.42;
    bodyRoot.position.y=Math.abs(Math.sin(wt))*0.05;
    bodyRoot.rotation.z=Math.sin(wt*.5)*0.04;
    headGroup.rotation.z=Math.sin(wt*.5)*0.06;headGroup.rotation.y=0;
  } else {
    isMoving=false;
    if(dancePhase>0){
      // ── SWAY DANCE ────────────────────────
      const dp=dancePhase;
      const sp=1+bass*0.7;
      const sw=t*1.7*sp;
      // gentle body sway side-to-side
      bodyRoot.position.y=L(bodyRoot.position.y, 0.04+Math.abs(Math.sin(sw*2))*0.03*(1+beatImpact*0.5), 0.10);
      bodyRoot.rotation.z=L(bodyRoot.rotation.z, Math.sin(sw)*(0.06+beatImpact*0.06)*dp, 0.08);
      bodyRoot.rotation.y=L(bodyRoot.rotation.y, Math.sin(sw*0.65)*0.10*dp, 0.06);
      // head counter-sways & looks around
      headGroup.rotation.z=L(headGroup.rotation.z,-Math.sin(sw)*0.11*dp,0.08);
      headGroup.rotation.y=L(headGroup.rotation.y, Math.sin(sw*0.5)*0.18*dp,0.06);
      // arms sway naturally with hips
      armLG.rotation.z=L(armLG.rotation.z,(0.18+Math.sin(sw+0.5)*0.22)*dp+0.18*(1-dp),0.08);
      armRG.rotation.z=L(armRG.rotation.z,(-0.18-Math.sin(sw+0.5)*0.22)*dp-0.18*(1-dp),0.08);
      armLG.rotation.x=L(armLG.rotation.x, Math.sin(sw*1.1)*0.14*dp,0.08);
      armRG.rotation.x=L(armRG.rotation.x,-Math.sin(sw*1.1)*0.14*dp,0.08);
      armLG.userData.eG.rotation.x=L(armLG.userData.eG.rotation.x,-0.12-Math.abs(Math.sin(sw))*0.14*dp,0.08);
      armRG.userData.eG.rotation.x=L(armRG.userData.eG.rotation.x,-0.12-Math.abs(Math.sin(sw))*0.14*dp,0.08);
      // legs barely shift weight
      legLG.rotation.z=L(legLG.rotation.z, Math.sin(sw)*0.06*dp,0.08);
      legRG.rotation.z=L(legRG.rotation.z,-Math.sin(sw)*0.06*dp,0.08);
      legLG.rotation.x=L(legLG.rotation.x, Math.sin(sw+0.4)*0.08*dp,0.08);
      legRG.rotation.x=L(legRG.rotation.x,-Math.sin(sw+0.4)*0.08*dp,0.08);
      legLG.userData.kG.rotation.x=L(legLG.userData.kG.rotation.x,Math.max(0,Math.sin(sw+0.3))*0.12*dp,0.08);
      legRG.userData.kG.rotation.x=L(legRG.userData.kG.rotation.x,Math.max(0,-Math.sin(sw+0.3))*0.12*dp,0.08);
      // beat spin
      if(beatImpact>.55)spinVel=Math.min(spinVel+0.04,0.07);
      alienGroup.rotation.y+=spinVel;spinVel*=0.94;
    } else {
      // ── IDLE ──────────────────────────────
      const id=t*1.05;
      bodyRoot.position.y=L(bodyRoot.position.y,Math.sin(id)*0.012,0.07);
      bodyRoot.rotation.y=L(bodyRoot.rotation.y,0,0.04);
      bodyRoot.rotation.z=L(bodyRoot.rotation.z,0,0.05);
      headGroup.rotation.z=Math.sin(id*.72)*0.032;
      headGroup.rotation.y=L(headGroup.rotation.y,0,0.04);
      [armLG,armRG].forEach((ag,i)=>{
        ag.rotation.x=L(ag.rotation.x,0,0.06);
        ag.rotation.z=L(ag.rotation.z,i===0?0.18:-0.18,0.06);
        ag.userData.eG.rotation.x=L(ag.userData.eG.rotation.x,-0.08,0.06);
      });
      [legLG,legRG].forEach(lg=>{
        lg.rotation.x=L(lg.rotation.x,0,0.07);
        lg.rotation.z=L(lg.rotation.z,0,0.07);
        lg.userData.kG.rotation.x=L(lg.userData.kG.rotation.x,0,0.07);
      });
      alienGroup.rotation.y=L(alienGroup.rotation.y,0,0.016);
    }
  }

  // ── RECORD PLAYER ─────────────────────────
  if(musicPlaying){
    spinAngle+=dt*(4.0+bass*3.5);
    spinParts.forEach(m=>{if(m.rotation)m.rotation.y=spinAngle;});
    taSwing.rotation.y=L(taSwing.rotation.y,TA_PLAY,.05);
    rpLight.intensity=L(rpLight.intensity,1.2+beatImpact*1.6,.08);
    rpLight.color.setHSL(.95+bass*.05,1,.48);
    knobM.material.emissive=new THREE.Color().setHSL(0,1,.16+beatImpact*.2);
    knobM.material.emissiveIntensity=0.5+beatImpact*.5;
    dL1.intensity=L(dL1.intensity,2.0+beatImpact*1.4,.05);
    dL2.intensity=L(dL2.intensity,2.0+beatImpact*1.4,.05);
    dL3.intensity=L(dL3.intensity,1.4+beatImpact*1.0,.05);
    discoArm.rotation.y+=dt*(0.7+bass*0.8);
    discoBall.rotation.y+=dt*0.42;
    dbRing.rotation.y+=dt*0.42;dbRing.rotation.x=Math.sin(t*.44)*.13;
    hintOpacity=L(hintOpacity,0,0.04);
  } else {
    taSwing.rotation.y=L(taSwing.rotation.y,TA_REST,.04);
    rpLight.intensity=L(rpLight.intensity,0.18,.04);
    rpLight.color.setHex(0xff2255);
    dL1.intensity=L(dL1.intensity,0,.04);
    dL2.intensity=L(dL2.intensity,0,.04);
    dL3.intensity=L(dL3.intensity,0,.04);
    knobM.material.emissiveIntensity=L(knobM.material.emissiveIntensity,0,.04);
    hintOpacity=0.75+Math.sin(t*2.2)*.12;
  }

  // ── LIGHT SHOW STORY ──────────────────────
  // lightHue slowly sweeps the colour wheel when music plays
  if(musicPlaying) lightHue=(lightHue+dt*0.038+bass*0.018)%1;

  // Story chapters – each light enters at a different time
  // Chapter stagger: lights 0-5 enter at t=2.5, 3.2, 4.0, 4.8, 5.5, 6.2
  const lightEnterTimes=[2.5,3.2,4.0,4.8,5.5,6.2];
  // 40-second cycle for colour narrative
  const cycle=(musicTime%40)/40;

  SL.forEach((sl,i)=>{
    const enter=S01(musicTime, lightEnterTimes[i], lightEnterTimes[i]+1.5);
    if(enter===0){sl.intensity=0;return;}

    // Each light gets a hue offset around the wheel
    const hOff=i/SL.length;
    // narrative arc: warm → cool → full spectrum → rich jewel
    const narrativeHue=(lightHue+hOff+cycle*0.4)%1;
    sl.color.setHSL(narrativeHue,0.9,0.48);

    // Beat flash + energy
    const baseInt = 0.8+energy*0.6;
    const beatFlash = i%2===0 ? beatImpact*2.2 : beatImpact*1.5;
    sl.intensity=L(sl.intensity, enter*(baseInt+beatFlash), 0.06);
  });

  // Drift the ambient hue slightly with the story
  if(musicPlaying){
    const r=new THREE.Color();r.setHSL(lightHue,0.35,0.03+energy*0.02);
    scene.background.set(r);
    scene.fog.color.set(r);
  } else {
    scene.background.lerp(new THREE.Color(0x020206),0.03);
    scene.fog.color.lerp(new THREE.Color(0x020206),0.03);
  }

  // LED strips shift colour with music
  ledL.color.setHSL((lightHue+0.55)%1,0.9,0.5);
  ledR.color.setHSL((lightHue+0.05)%1,0.9,0.5);
  ledL.intensity=L(ledL.intensity, musicPlaying?(0.6+energy*0.5):0.55, 0.05);
  ledR.intensity=L(ledR.intensity, musicPlaying?(0.6+energy*0.5):0.55, 0.05);

  // Screen glow
  screenFX.material.color.setHSL(.62+Math.sin(t*.32)*.04,.6,.1+energy*.09);
  monFX.material.color.setHSL(.65+Math.sin(t*.28)*.06,.55,.08+energy*.1);
  lapLight.intensity=0.6+energy*.4+Math.sin(t*1.8)*.06;

  // Main light dims slightly when show is up
  mainL.intensity=L(mainL.intensity, musicPlaying?(1.2+beatImpact*.5+energy*.3):1.8, 0.04);

  // Alien eye glow
  alienEyeLight.intensity=L(alienEyeLight.intensity,
    musicPlaying?(0.25+beatImpact*.45):(0.08+Math.sin(t*1.4)*.05),0.07);

  // Antenna pulse
  const ag=0.4+Math.sin(t*2.4)*.3+(musicPlaying?beatImpact*.8:0);
  antennaBalls.forEach(b=>b.material.emissiveIntensity=Math.max(0.12,ag));

  // Hint sign
  hintSign.material.opacity=Math.max(0,hintOpacity);
  hintSign.position.y=2.95+Math.sin(t*1.6)*.07;
  hintSign.lookAt(camera.position);

  renderer.render(scene,camera);
}
animate();
</script>
