    #rotate-prompt p { max-width: 20em; }
    @keyframes rp-turn {

    /* Up while upright, until "Play upright anyway" is pressed (html.rp-upright) or the game has loaded

  <div id="unity-container">

  <div id="rotate-prompt" role="dialog" aria-label="Turn your phone sideways">

    <h2>Turn your phone sideways</h2>
    <p>Yooba Land plays best in landscape. Turn your phone to continue.</p>
    <button type="button" id="rp-upright">Play upright anyway</button>
  </div>
  <script>
    // "Play upright anyway": put the prompt away for this visit (sessionStorage, so a reload or coming back from
    // home keeps it), and pass ?rotate=0 on so the game's own prompt doesn't ask again once it loads. The game's
    // pill sets the same two things (YoobaRotate.jslib), so either one holds for the whole visit.
    (function () {
      var chosen = false;
      try { chosen = /[?&]rotate=0(&|$)/.test(location.search) || sessionStorage.getItem("yoobaRotateUpright") === "1"; } catch (e) {}
      if (chosen) document.documentElement.className += " rp-upright";
    })();
    document.getElementById("rp-upright").addEventListener("click", function () {
      document.documentElement.className += " rp-upright";
      try { sessionStorage.setItem("yoobaRotateUpright", "1"); } catch (e) {}
      try {
        var url = new URL(location.href);
        url.searchParams.set("rotate", "0");
        history.replaceState(history.state, "", url.toString());
      } catch (e) {}
    });
  </script>
  <div id="chrome-reveal"></div>
  <div id="chrome-strip">
    <a id="home-link" class="home" href="../" title="Back to Yooba Land home" aria-label="Back to Yooba Land home">&#x2190;</a>
    <button type="button" id="fullscreen-button" aria-label="Enter fullscreen" title="Fullscreen" aria-pressed="false">&#x26F6;</button>
  </div>
  <div id="version-display"></div>
  <script>
    var gameVersion = window.YOOBA_BUILD;
    var gameName = "YoobaLand";
    document.getElementById("version-display").textContent = gameVersion;

    if (gameVersion === "v0") {
      document.getElementById("unity-loading-bar").style.display = "none";
      document.getElementById("missing-build").style.display = "block";
    } else {
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // No raw Unity banner text: errors go to the branded failure panel, warnings to the console.
      function unityShowBanner(msg, type) {
        if (type === "error") loadFailed(String(msg).replace(/<[^>]*>/g, ""));
        else console.warn("Unity:", msg);
      }

      // Lore while the biggest download of the site comes in: from the story the game tells (docs/story.md).
      var tips = [
        "Yooba is small and hungry, and all he wants is to get home.",
        "Yooba blew in from The Gust and landed inside a glass fence.",
        "Past the broken glass lies a town full of other Yoobas.",
        "Old Reed fishes all day. His advice is always the same: sit still.",
        "Bramley the farmer once gave away a golden seed. Ask what it grows.",
        "Somewhere out on the hills, a goatherd is whistling a tune.",
        "The mayor knows everyone in town. Everyone knows the mayor.",
        "Share the world with other Yoobas right in the browser, or wander alone and offline."
      ];
      var tipEl = document.getElementById("unity-tip");
      var pctEl = document.getElementById("unity-progress-text");
      var labelEl = document.getElementById("unity-label");
      var barEmpty = document.getElementById("unity-progress-bar-empty");
      var tipIndex = Math.floor(Math.random() * tips.length);
      var tipTimer = null;
      function showTip() { tipEl.textContent = tips[tipIndex]; tipIndex = (tipIndex + 1) % tips.length; }

      // Honest bar: Unity's loader fills 0-70%, the game's own content progress (window.yoobaLoad) 70-100%.
      var STALL_MS = 45000;
      var stallTimer = null;
      var unityInstance = null;
      var loadDone = false;
      var attempt = 0;
      var gameReported = false;
      var finishTimer = null;
      function setBar(pct, label) {
        pct = Math.max(0, Math.min(100, Math.round(pct)));
        progressBarFull.style.width = pct + "%";
        pctEl.textContent = pct + "%";
        barEmpty.setAttribute("aria-valuenow", pct);
        if (label !== undefined) labelEl.textContent = label ? "\u00b7 " + label : "";
      }
      // Any progress re-arms the 45 s watchdog (event-driven: no polling).
      function armStall() {
        clearTimeout(stallTimer);
        stallTimer = setTimeout(function () { loadFailed("No progress for 45 s"); }, STALL_MS);
      }
      function showGame() {
        if (loadDone) return;
        loadDone = true;
        clearTimeout(stallTimer);
        clearTimeout(finishTimer);
        clearInterval(tipTimer);
        setBar(100);
        loadingBar.style.display = "none";
        container.className += " loaded";
        document.documentElement.className += " rp-game";
      }
      // The game calls this as it gathers its content: yoobaLoad(0..1, "Gathering the meadow\u2026"). 1 ends the load.
      window.yoobaLoad = function (progress, label) {
        if (loadDone || loadingBar.className === "failed") return;
        gameReported = true;
        progress = Math.max(0, Math.min(1, Number(progress) || 0));
        setBar(70 + 30 * progress, label || "Gathering the meadow\u2026");
        armStall();
        if (progress >= 1 && unityInstance) showGame();
      };

      function loadFailed(message) {
        if (loadDone) return;
        clearInterval(tipTimer);
        clearTimeout(stallTimer);
        clearTimeout(finishTimer);
        loadingBar.className = "failed";
        loadingBar.style.display = "";
        document.getElementById("unity-fail-detail").textContent = String(message || "").slice(0, 200);
        console.error("Yooba Land failed to load:", message);
      }

      function hasWebGL() {
        try {
          var c = document.createElement("canvas");
          return !!(c.getContext("webgl2") || c.getContext("webgl"));
        } catch (e) { return false; }
      }

      // ?loadfail=1 or ?playtest=fail-load points the loader at a missing file, to see the failure screen (playtests).
      var failLoad = /[?&]loadfail=1\b/.test(location.search) || /[?&]playtest=fail-load\b/.test(location.search);

      function startLoad() {
        attempt++;
        container.setAttribute("data-attempt", attempt);
        loadingBar.className = "";
        loadingBar.style.display = "";
        gameReported = false;
        setBar(0, "");
        showTip();
        clearInterval(tipTimer);
        // Local rotation only: no requests. Stopped when the game runs or the load fails.
        tipTimer = setInterval(showTip, 4500);
        if (!hasWebGL()) {
          loadFailed("WebGL is not supported");
          document.getElementById("unity-fail-line").textContent = "This browser can't draw Yooba Land. Try another browser or device.";
          return;
        }
        document.getElementById("unity-fail-line").textContent = "The meadow didn't open this time. Let's give it another go.";
        armStall();
        var old = document.getElementById("unity-loader-script");
        if (old) old.remove();
        var loader = document.createElement("script");
        loader.id = "unity-loader-script";
        loader.src = failLoad ? buildBase + "does-not-exist.loader.js?a=" + attempt : buildUrl + ".loader.js?v=" + gameVersion;
        var mine = attempt;
        loader.onload = function () {
          if (mine !== attempt) return;
          createUnityInstance(canvas, config, function (progress) {
            if (mine !== attempt) return;
            // Unity reports 0.9 when the download is done and 1 when it has started.
            setBar(70 * Math.min(1, progress / 0.9), "");
            armStall();
          }).then(function (instance) {
            if (mine !== attempt) { instance.Quit(); return; }
            unityInstance = instance;
            setBar(70);
            // A game that never calls yoobaLoad still gets in after a short grace.
            if (gameReported) return;
            finishTimer = setTimeout(function () { if (!gameReported) showGame(); }, 3000);
          }).catch(function (message) {
            if (mine === attempt) loadFailed(message);
          });
        };
        loader.onerror = function () {
          if (mine === attempt) loadFailed("Could not load " + loader.src);
        };
        document.body.appendChild(loader);
      }

      // Retry without a full page reload: quit any half-started instance, then load again.
      document.getElementById("unity-retry").addEventListener("click", function () {
        var inst = unityInstance;
        unityInstance = null;
        var again = function () { startLoad(); };
        if (inst && inst.Quit) inst.Quit().then(again, again); else again();
      });

      function fitCanvas() {
        var width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
        var height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
      }
      window.addEventListener("resize", fitCanvas);
      fitCanvas();

      // Builds in R2 (hawkesstudio docs/unity-builds-storage.md): the cloud build sets HAWKES_BUILD_BASE; without it, from here.
      // A Hawkes Studio build (publish.page "site") names its own address in HAWKES_BUILD_URL; else the versioned folder.
      var buildBase = window.HAWKES_BUILD_URL || ((window.HAWKES_BUILD_BASE || "") + gameVersion + "/");
      var buildUrl = buildBase + gameName + "/Build/" + gameName;
      var config = {
        arguments: [],
        dataUrl: buildUrl + ".data.unityweb?v=" + gameVersion,
        frameworkUrl: buildUrl + ".framework.js.unityweb?v=" + gameVersion,
        codeUrl: buildUrl + ".wasm.unityweb?v=" + gameVersion,
        streamingAssetsUrl: buildBase + gameName + "/StreamingAssets",
        companyName: "Yooba",
        productName: "YoobaLand",
        productVersion: gameVersion,
        showBanner: unityShowBanner,
      };

      startLoad();
    }
  </script>
  <script>
    // Hawkes Analytics: the release's version in front of the build folder, "1.0.0+v32".
    (function () {
      if (!window.hawkesRelease || !window.HAWKES_BUILD) return;
      window.hawkesRelease.then(function (r) {
        var version = r && (r.current || (r.releases && r.releases[0] && r.releases[0].version));
        if (version) window.HAWKES_BUILD.version = version + "+" + window.YOOBA_BUILD;
      });
    })();
  </script>

  <script>
    // The release (releases.json) and the build running, "v1.0.0 \u00b7 build 14", linking to What's new.
    (function () {
      var display = document.getElementById("version-display");
      if (!display || !window.hawkesRelease) return;
      window.hawkesRelease.then(function (r) {
        var top = r && r.releases && r.releases[0];
        if (!top) return;
        var host = location.hostname;
        var beta = /\.hawkesgen\.com$/.test(host) || host === "localhost" || host === "127.0.0.1";
        var link = document.createElement("a");
        link.href = "../whatsnew.html";
        link.target = "_blank";
        link.rel = "noopener";
        link.title = "What's new in Yooba Land";
        link.style.color = "inherit";
        link.style.textDecoration = "none";
        link.textContent = "v" + top.version + (beta ? " beta" : "") + " \u00b7 build " + String(window.YOOBA_BUILD || "").replace(/^v/, "");
        display.textContent = "";
        display.appendChild(link);
      });
    })();
  </script>

  <script>
    // Fullscreen toggle. A tap is a user gesture, so the request is allowed. Where the browser has no element
    // fullscreen (iPhone Safari), the button stays hidden. Landscape lock is best effort: most phones refuse it.
    (function () {
      var button = document.getElementById("fullscreen-button");
      var target = document.getElementById("unity-container");
      if (!button || !target) return;
      var el = document.documentElement;
      var canRequest = !!(el.requestFullscreen || el.webkitRequestFullscreen);
      var enabled = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
      if (!canRequest || !enabled) return;
      button.classList.add("available");

      function inFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
      function render() {
        var on = inFullscreen();
        button.setAttribute("aria-pressed", on ? "true" : "false");
        button.setAttribute("aria-label", on ? "Leave fullscreen" : "Enter fullscreen");
        button.title = on ? "Leave fullscreen" : "Fullscreen";
        button.innerHTML = on ? "&#x2715;" : "&#x26F6;";
      }
      button.addEventListener("click", function () {
        if (inFullscreen()) {
          var exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
          return;
        }
        var request = el.requestFullscreen || el.webkitRequestFullscreen;
        var result = request.call(el);
        if (result && result.then) {
          result.then(function () {
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
          }).catch(function () {});
        }
      });
      document.addEventListener("fullscreenchange", render);
      document.addEventListener("webkitfullscreenchange", render);
      render();
    })();
  </script>
  <script>
    // Control strip: Leave-the-game question, fade during play, iOS bar fallback. Tap to play: pointerdown and
    // touchend count as well as click, and the prompt goes as soon as the audio context is running.
    (function () {
      var root = document.documentElement;
      var home = document.getElementById("home-link");
      home.addEventListener("click", function (e) {
        if (!window.confirm("Leave the game?")) e.preventDefault();
      });

      var idleTimer = 0;
      function show() { root.classList.remove("chrome-idle"); clearTimeout(idleTimer); arm(); }
      function arm() {
        clearTimeout(idleTimer);
        if (document.getElementById("hawkes-tap")) return;
        idleTimer = setTimeout(function () { root.classList.add("chrome-idle"); }, 4000);
      }
      var reveal = document.getElementById("chrome-reveal");
      reveal.addEventListener("pointerdown", function (e) { e.stopPropagation(); show(); });
      reveal.addEventListener("pointermove", show);
      reveal.addEventListener("touchstart", function (e) { e.stopPropagation(); show(); }, { passive: true });

      function dismissTap() {
        var tap = document.getElementById("hawkes-tap");
        if (tap && !tap.classList.contains("gone")) tap.click();
      }
      function audioRunning() {
        try { return window.hawkesSound && JSON.parse(window.hawkesSound.state()).audio === "running"; } catch (e) { return false; }
      }
      function onTapGesture(e) {
        var tap = document.getElementById("hawkes-tap");
        if (!tap || !tap.contains(e.target)) return;
        dismissTap();
        var tries = 0;
        (function check() {
          var left = document.getElementById("hawkes-tap");
          if (left && audioRunning()) { left.className = "gone"; left.style.pointerEvents = "none"; }
          if (left && ++tries < 20) setTimeout(check, 100);
        })();
      }
      document.addEventListener("pointerdown", onTapGesture, true);
      document.addEventListener("touchend", onTapGesture, true);

      // Start the fade timer once Tap to play is gone.
      var watch = new MutationObserver(function () {
        if (!document.getElementById("hawkes-tap") || document.getElementById("hawkes-tap").classList.contains("gone")) arm();
      });
      watch.observe(document.body, { childList: true, attributes: true, subtree: true, attributeFilter: ["class"] });

      // No element fullscreen (iPhone Safari): nudge the page up so the address bar tucks away.
      var el = document.documentElement;
      if (!(el.requestFullscreen || el.webkitRequestFullscreen)) {
        var hide = function () { setTimeout(function () { window.scrollTo(0, 1); }, 300); };
        window.addEventListener("orientationchange", hide);
        window.addEventListener("load", hide);
      }
    })();
  </script>
