  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #143226;
      touch-action: none;
    }
    /* Until the game is running, the page shows the landing page's in-game art (../images/hero-yooba.jpg) behind the
       canvas; once it runs (.loaded, set below) the canvas is plain dark again. */
    #unity-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #5cdbee url("../images/hero-yooba.jpg") 20% 50% / cover no-repeat;
    }
    #unity-container::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(16, 40, 28, 0.55);
      pointer-events: none;
    }
    #unity-container.loaded { background: #111; }
    #unity-container.loaded::before { display: none; }
    /* The canvas fills the container from the first paint (absolute, sized to the viewport), so nothing moves when the game appears. */
    #unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: transparent; }
    #unity-container.loaded #unity-canvas { background: #111; }
    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(360px, 84vw);
      padding: 18px 22px 22px;
      text-align: center;
      color: white;
      font: 600 20px Fredoka, "Trebuchet MS", Arial, sans-serif;
      background: rgba(16, 40, 28, 0.82);
      border: 3px solid #10281c;
      border-radius: 22px;
      box-shadow: 0 6px 0 #10281c, 0 12px 30px rgba(0, 0, 0, 0.35);
    }
    #unity-loading-bar .ld-title { font-size: 22px; line-height: 1.2; color: #ffe56a; }
    #unity-loading-bar .ld-pct { margin-top: 8px; font-size: 16px; opacity: .85; font-variant-numeric: tabular-nums; }
    /* Fixed height for the tip: three lines of room, so rotating lines never resize the card. */
    #unity-loading-bar .ld-tip {
      margin-top: 12px;
      height: 4.8em;
      overflow: hidden;
      font: 700 15px/1.6 Nunito, Arial, sans-serif;
      color: #d9f2e4;
    }
    #unity-loading-bar .ld-fail { display: none; }
    #unity-loading-bar.failed .ld-busy { display: none; }
    #unity-loading-bar.failed .ld-fail { display: block; }
    #unity-loading-bar .ld-fail p { font: 700 15px/1.5 Nunito, Arial, sans-serif; margin-top: 10px; color: #d9f2e4; }
    #unity-loading-bar .ld-fail small { display: block; margin-top: 8px; font: 700 12px Nunito, Arial, sans-serif; opacity: .6; word-break: break-all; }
    #unity-retry {
      margin-top: 16px;
      font: 600 18px Fredoka, "Trebuchet MS", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: .02em;
      color: #143226;
      background: #ffe56a;
      border: 3px solid #10281c;
      border-radius: 999px;
      padding: 8px 26px;
      box-shadow: 0 4px 0 #10281c;
      cursor: pointer;
    }
    #unity-retry:active { transform: translateY(2px); box-shadow: 0 2px 0 #10281c; }
    #unity-progress-bar-empty {
      width: 100%;
      height: 18px;
      margin: 14px auto 0;
      background: rgba(255, 255, 255, 0.16);
      border: 2px solid #10281c;
      border-radius: 999px;
      overflow: hidden;
    }
    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #23c34a, #89ce00);
      border-radius: 999px;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), inset 0 3px 0 rgba(255, 255, 255, 0.3);
      transition: width 0.2s ease-out;
    }
    /* The Tap to play screen is hawkes-sound.js's (written by the Unity deploy); its look is set here, after the
       script's own style: the same in-game art as the landing page instead of the drawn hills and Yooba. */
    html body #hawkes-tap {
      justify-content: flex-end;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(9vh + env(safe-area-inset-bottom)) env(safe-area-inset-left);
      background:
        linear-gradient(180deg, rgba(16, 40, 28, 0) 30%, rgba(16, 40, 28, 0.55) 62%, rgba(16, 40, 28, 0.9) 100%),
        #5cdbee url("../images/hero-yooba.jpg") 20% 50% / cover no-repeat;
      font-family: Fredoka, "Trebuchet MS", Arial, sans-serif;
    }
    html body #hawkes-tap svg { display: none; }
    html body #hawkes-tap h1 {
      font-family: Fredoka, "Trebuchet MS", Arial, sans-serif;
      font-weight: 600;
      color: #ffe56a;
      text-shadow: .04em .04em 0 #10281c, -.04em .04em 0 #10281c, .04em -.04em 0 #10281c, -.04em -.04em 0 #10281c,
        0 .1em 0 #10281c, 0 .16em .4em rgba(0, 0, 0, .45);
    }
    html body #hawkes-tap button {
      display: inline-flex;
      align-items: center;
      gap: .45em;
      font-family: Fredoka, "Trebuchet MS", Arial, sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .02em;
      color: #143226;
      background: #ffe56a;
      border: 3px solid #10281c;
      box-shadow: 0 .14em 0 #10281c, 0 .3em .8em rgba(0, 0, 0, .35);
    }
    html body #hawkes-tap button::before {
      content: "";
      border-style: solid;
      border-width: .38em 0 .38em .62em;
      border-color: transparent transparent transparent currentColor;
    }
    html body #hawkes-tap p {
      font-family: Nunito, Arial, sans-serif;
      font-weight: 800;
      max-width: 34em;
    }
    /* Portrait (phones): keep all of Yooba in the frame. */
    @media (max-aspect-ratio: 1/1) {
      html body #hawkes-tap { background-position: 0 0, 5% 50%; }
      #unity-container { background-position: 5% 50%; }
    }
    #unity-warning {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      max-width: 90%;
      z-index: 2;
    }
    #version-display {
      position: absolute;
      right: 12px;
      bottom: 8px;
      color: rgba(255, 255, 255, 0.55);
      font-family: Arial, sans-serif;
      font-size: 12px;
    }
    #missing-build {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      max-width: 520px;
      line-height: 1.5;
    }
    a.home {
      color: #8fd9b4;
    }
    /* Phones held upright: a full-screen prompt to turn the phone sideways. Touch devices only (a laptop never sees it). */
    #rotate-prompt {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      background: radial-gradient(ellipse at 50% 40%, #2c5e46 0%, #143226 70%);
      color: #d9f2e4;
      font: 700 18px/1.5 Nunito, Arial, sans-serif;
    }
    #rotate-prompt .rp-phone {
      width: 56px;
      height: 92px;
      border: 4px solid #ffe56a;
      border-radius: 12px;
      position: relative;
      animation: rp-turn 2.4s ease-in-out infinite;
    }
    #rotate-prompt .rp-phone::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 7px;
      width: 12px;
      height: 4px;
      margin-left: -6px;
      border-radius: 2px;
      background: #ffe56a;
    }
    #rotate-prompt h2 { font: 600 28px/1.2 Fredoka, "Trebuchet MS", Arial, sans-serif; color: #ffe56a; }
    #rotate-prompt p { max-width: 20em; }
    @keyframes rp-turn {
      0%, 25% { transform: rotate(0deg); }
      50%, 80% { transform: rotate(-90deg); }
      100% { transform: rotate(-90deg); }
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-prompt { display: flex; }
    }
    /* Fullscreen toggle, bottom left (clear of the version label). Hidden where the browser has no element fullscreen. */
    #fullscreen-button {
      display: none;
      position: absolute;
      left: 12px;
      bottom: 8px;
      z-index: 3;
      width: 44px;
      height: 44px;
      border: 3px solid #10281c;
      border-radius: 14px;
      background: rgba(255, 229, 106, 0.92);
      color: #143226;
      box-shadow: 0 3px 0 #10281c;
      font: 700 22px/1 Nunito, Arial, sans-serif;
      cursor: pointer;
      touch-action: manipulation;
    }
    #fullscreen-button:active { transform: translateY(2px); box-shadow: 0 1px 0 #10281c; }
    #fullscreen-button.available { display: block; }
  </style>
  <script>window.YOOBA_BUILD = "v185";</script>
  <script>window.HAWKES_NET_ENDPOINT = window.HAWKES_NET_ENDPOINT || 'https://net.hawkesgen.ai'; // builds before 2026-10-28 have net.hawkesgen.com baked in; beta pages set their own first</script>
  <!-- Hawkes Analytics: the page loads the SDK once; the game's bridge finds it (data-hawkes-analytics) and adds no second copy -->
  <script>
    // The build this page loads, the way the game names it: releases.json's version plus the Game/v<n> folder
    // ("1.0.0+v32"). The folder alone until releases.json is read (below); the SDK reads it for every batch.
    window.HAWKES_BUILD = { version: String(window.YOOBA_BUILD || "") };
  </script>
  <script src="https://hawkesgen.ai/sdk/analytics@1.js" data-product="yoobaland" data-hawkes-analytics="page" defer></script>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div class="ld-busy" role="status" aria-live="off">
        <div class="ld-title">Loading Yooba Land</div>
        <div id="unity-progress-bar-empty" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="unity-progress-bar-full"></div></div>
        <div class="ld-pct" id="unity-progress-text">0%</div>
        <div class="ld-tip" id="unity-tip"></div>
      </div>
      <div class="ld-fail" role="alert">
        <div class="ld-title">Yooba got lost on the way</div>
        <p>The game didn't finish loading. Check your connection, then try again.</p>
        <small id="unity-fail-detail"></small>
        <button type="button" id="unity-retry">Try again</button>
      </div>
    </div>
    <div id="missing-build">
      <p>No game build has been published yet.</p>
      <p style="margin-top: 12px;"><a class="home" href="../">Back home</a></p>
    </div>
    <div id="unity-warning"></div>
  </div>
  <div id="rotate-prompt" role="dialog" aria-label="Turn your phone sideways">
    <div class="rp-phone" aria-hidden="true"></div>
    <h2>Turn your phone sideways</h2>
    <p>Yooba Land plays best in landscape. Turn your phone to continue.</p>
  </div>
  <button type="button" id="fullscreen-button" aria-label="Enter fullscreen" title="Fullscreen" aria-pressed="false">&#x26F6;</button>
  <div id="version-display"></div>
  <script>
    var gameVersion = window.YOOBA_BUILD;
    var gameName = "YoobaLand";
    document.getElementById("version-display").textContent = gameVersion;

    if (gameVersion === "v0") {
      document.getElementById("unity-loading-bar").style.display = "none";
      document.getElementById("missing-build").style.display = "block";
    } else {
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style.cssText = "background:" + (type === "warning" ? "rgba(255,193,7,0.95)" : "rgba(180,40,40,0.95)") + ";color:#111;padding:10px 14px;margin-top:8px;border-radius:6px;font-family:Arial,sans-serif;";
        warningBanner.appendChild(div);
        if (type !== "error") {
          setTimeout(function () {
            if (div.parentElement) div.parentElement.removeChild(div);
          }, 5000);
        }
      }

      // Lore while the biggest download of the site comes in: from the story the game tells (docs/story.md).
      var tips = [
        "Yooba is small and hungry, and all he wants is to get home.",
        "Yooba blew in from The Gust and landed inside a glass fence.",
        "Past the broken glass lies a town full of other Yoobas.",
        "Old Reed fishes all day. His advice is always the same: sit still.",
        "Bramley the farmer once gave away a golden seed. Ask what it grows.",
        "Somewhere out on the hills, a goatherd is whistling a tune.",
        "The mayor knows everyone in town. Everyone knows the mayor.",
        "Share the world with other Yoobas right in the browser, or wander alone and offline."
      ];
      var tipEl = document.getElementById("unity-tip");
      var pctEl = document.getElementById("unity-progress-text");
      var barEmpty = document.getElementById("unity-progress-bar-empty");
      var tipIndex = Math.floor(Math.random() * tips.length);
      var tipTimer = null;
      function showTip() { tipEl.textContent = tips[tipIndex]; tipIndex = (tipIndex + 1) % tips.length; }
      // Local rotation only: no requests. Stopped when the game runs or the load fails.
      showTip();
      tipTimer = setInterval(showTip, 4500);

      function loadFailed(message) {
        clearInterval(tipTimer);
        loadingBar.className = "failed";
        loadingBar.style.display = "";
        document.getElementById("unity-fail-detail").textContent = String(message || "").slice(0, 200);
        console.error("Yooba Land failed to load:", message);
      }
      document.getElementById("unity-retry").addEventListener("click", function () { location.reload(); });

      function fitCanvas() {
        var width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
        var height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
      }
      window.addEventListener("resize", fitCanvas);
      fitCanvas();

      // Builds in R2 (hawkesstudio docs/unity-builds-storage.md): the cloud build sets HAWKES_BUILD_BASE; without it, from here.
      // A Hawkes Studio build (publish.page "site") names its own address in HAWKES_BUILD_URL; else the versioned folder.
      var buildBase = window.HAWKES_BUILD_URL || ((window.HAWKES_BUILD_BASE || "") + gameVersion + "/");
      var buildUrl = buildBase + gameName + "/Build/" + gameName;
      var config = {
        arguments: [],
        dataUrl: buildUrl + ".data.unityweb?v=" + gameVersion,
        frameworkUrl: buildUrl + ".framework.js.unityweb?v=" + gameVersion,
        codeUrl: buildUrl + ".wasm.unityweb?v=" + gameVersion,
        streamingAssetsUrl: buildBase + gameName + "/StreamingAssets",
        companyName: "Yooba",
        productName: "YoobaLand",
        productVersion: gameVersion,
        showBanner: unityShowBanner,
      };

      var loader = document.createElement("script");
      // ?loadfail=1 points the loader at a missing file, to see the failure screen (used by playtests and reviews).
      loader.src = /[?&]loadfail=1\b/.test(location.search) ? buildBase + "does-not-exist.loader.js" : buildUrl + ".loader.js?v=" + gameVersion;
      loader.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var pct = Math.round(100 * progress);
          progressBarFull.style.width = pct + "%";
          pctEl.textContent = pct + "%";
          barEmpty.setAttribute("aria-valuenow", pct);
        }).then(function () {
          clearInterval(tipTimer);
          loadingBar.style.display = "none";
          container.className += " loaded";
        }).catch(function (message) {
          loadFailed(message);
        });
      };
      loader.onerror = function () {
        loadFailed("Could not load " + loader.src);
      };
      document.body.appendChild(loader);
    }
  </script>
  <script>
    // Hawkes Analytics: the release's version in front of the build folder, "1.0.0+v32".
    (function () {
      if (!window.hawkesRelease || !window.HAWKES_BUILD) return;
      window.hawkesRelease.then(function (r) {
        var version = r && (r.current || (r.releases && r.releases[0] && r.releases[0].version));
        if (version) window.HAWKES_BUILD.version = version + "+" + window.YOOBA_BUILD;
      });
    })();
  </script>
  <!-- Hawkes release: written by the deploy (YoobaWebBuild.InstallReleaseNotes); edit it there -->
  <script src="../js/hawkes-release.js" data-releases="../releases.json"></script>
  <script>
    // The release (releases.json) and the build running, "v1.0.0 \u00b7 build 14", linking to What's new.
    (function () {
      var display = document.getElementById("version-display");
      if (!display || !window.hawkesRelease) return;
      window.hawkesRelease.then(function (r) {
        var top = r && r.releases && r.releases[0];
        if (!top) return;
        var host = location.hostname;
        var beta = /\.hawkesgen\.com$/.test(host) || host === "localhost" || host === "127.0.0.1";
        var link = document.createElement("a");
        link.href = "../whatsnew.html";
        link.target = "_blank";
        link.rel = "noopener";
        link.title = "What's new in Yooba Land";
        link.style.color = "inherit";
        link.style.textDecoration = "none";
        link.textContent = "v" + top.version + (beta ? " beta" : "") + " \u00b7 build " + String(window.YOOBA_BUILD || "").replace(/^v/, "");
        display.textContent = "";
        display.appendChild(link);
      });
    })();
  </script>
  <!-- /Hawkes release -->
  <script>
    // Fullscreen toggle. A tap is a user gesture, so the request is allowed. Where the browser has no element
    // fullscreen (iPhone Safari), the button stays hidden. Landscape lock is best effort: most phones refuse it.
    (function () {
      var button = document.getElementById("fullscreen-button");
      var target = document.getElementById("unity-container");
      if (!button || !target) return;
      var el = document.documentElement;
      var canRequest = !!(el.requestFullscreen || el.webkitRequestFullscreen);
      var enabled = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
      if (!canRequest || !enabled) return;
      button.classList.add("available");

      function inFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
      function render() {
        var on = inFullscreen();
        button.setAttribute("aria-pressed", on ? "true" : "false");
        button.setAttribute("aria-label", on ? "Leave fullscreen" : "Enter fullscreen");
        button.title = on ? "Leave fullscreen" : "Fullscreen";
        button.innerHTML = on ? "&#x2715;" : "&#x26F6;";
      }
      button.addEventListener("click", function () {
        if (inFullscreen()) {
          var exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
          return;
        }
        var request = el.requestFullscreen || el.webkitRequestFullscreen;
        var result = request.call(el);
        if (result && result.then) {
          result.then(function () {
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
          }).catch(function () {});
        }
      });
      document.addEventListener("fullscreenchange", render);
      document.addEventListener("webkitfullscreenchange", render);
      render();
    })();
  </script>
</body>
